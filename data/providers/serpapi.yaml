id: serpapi
name: SerpApi
category: web-search-data
homepage: https://serpapi.com
summary: Real-time JSON API for Google and other search engines' results, with an official MCP server, llms.txt, and a free monthly quota.
submitted_by: community

tags:
  - search
  - scraping

entrypoints:
  docs: https://serpapi.com/search-api
  api_reference: https://serpapi.com/search-api
  llms_txt: https://serpapi.com/llms.txt
  status_page: https://serpapi.com/status
  pricing: https://serpapi.com/pricing
  signup: https://serpapi.com/users/sign_up
  api_keys: https://serpapi.com/manage-api-key
  mcp_official: https://github.com/serpapi/serpapi-mcp

checks:
  self_serve_signup:
    status: supported
    evidence: https://serpapi.com/users/sign_up
    verified: "2026-07-08"

  api_key_self_serve:
    status: supported
    evidence: https://serpapi.com/manage-api-key
    verified: "2026-07-08"

  oauth_support:
    status: unknown

  scoped_tokens:
    status: unknown

  token_revocation:
    status: unknown

  sandbox_or_test_mode:
    status: unknown
    notes: Playground exists for interactive testing; needs the canonical docs link as evidence.

  free_tier_or_trial:
    status: supported
    evidence: https://serpapi.com/pricing
    verified: "2026-07-08"
    notes: Free plan with monthly search quota.

  self_serve_paid_upgrade:
    status: supported
    evidence: https://serpapi.com/pricing
    verified: "2026-07-08"

  usage_dashboard:
    status: unknown

  idempotency:
    status: unknown

  versioning_policy:
    status: unknown

  automation_permitted:
    status: unknown
    notes: ToS not yet reviewed and recorded.

# Flight-route research; source claims only, not a task verification.
catalog:
  version: 1
  classifications:
    - travel/flights
    - web-search-data/web-search
  sources:
    flights:
      url: https://serpapi.com/google-flights-api
      checked_on: '2026-09-07'
      kind: official_docs
    signup:
      url: https://serpapi.com/users/sign_up
      checked_on: '2026-09-07'
      kind: official_site
    pricing:
      url: https://serpapi.com/pricing
      checked_on: '2026-09-07'
      kind: official_site
    mcp:
      url: https://github.com/serpapi/serpapi-mcp
      checked_on: '2026-09-07'
      kind: official_repo
    web-docs:
      url: https://serpapi.com/search-api
      checked_on: '2026-09-07'
      kind: official_docs
  routes:
    - id: google-flights-api
      docs: https://serpapi.com/google-flights-api
      interface: api
      maintainer: official
      entry_url: https://serpapi.com/google-flights-api
      evidence:
        - flights
      upstream: google-flights
      capabilities:
        flights.search:
          value: documented
          evidence:
            - flights
      auth:
        value: api_key
        evidence:
          - flights
      availability:
        value: self_serve
        evidence:
          - signup
      costs:
        - kind: free_allowance
          amount: 250
          unit: searches
          per: month
          scope: Platform search allowance; flight-endpoint entitlement and shared usage untested.
          evidence:
            - pricing
      notes: A third-party Google Flights data service. Not a Google-operated API.
    - id: official-mcp
      docs: https://github.com/serpapi/serpapi-mcp
      interface: mcp
      maintainer: official
      entry_url: https://github.com/serpapi/serpapi-mcp
      evidence:
        - mcp
      notes: >-
        Official to SerpApi. Flight tool coverage and access gates are unconfirmed; do not inherit API-route
        results.
    - id: web-search-api
      docs: https://serpapi.com/search-api
      interface: api
      maintainer: official
      entry_url: https://serpapi.com/search-api
      evidence:
        - web-docs
      availability:
        value: self_serve
        evidence:
          - web-docs
      personal_access:
        value: unknown
      auth:
        value: api_key
        evidence:
          - web-docs
      capabilities:
        web.search:
          value: documented
          evidence:
            - web-docs
      notes: Separate from Google Flights API. Existing flight evaluations do not establish web search performance.
