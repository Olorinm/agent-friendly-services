id: lark
name: Lark
category: communication
homepage: https://www.larksuite.com
summary: Collaboration suite (messaging, docs, calendar) with an open platform, llms.txt, an official CLI with 200+ commands and agent skills, and an official OpenAPI MCP server.
submitted_by: community
scope: "Lark Open Platform (international larksuite.com edition); the Feishu (China) edition has a separate developer portal."

tags:
  - messaging
  - collaboration
  - bots

entrypoints:
  docs: https://open.larksuite.com/document/home/index
  api_reference: https://open.larksuite.com/document/server-docs/getting-started/server-api-list
  llms_txt: https://open.larksuite.com/llms.txt
  status_page: https://status.larksuite.com
  pricing: https://www.larksuite.com/en_us/plans
  signup: https://www.larksuite.com
  api_keys: https://open.larksuite.com/document/faq/trouble-shooting/how-to-obtain-app-access-token
  cli: https://github.com/larksuite/cli
  mcp_official: https://github.com/larksuite/lark-openapi-mcp
  agent_docs: https://open.larksuite.com/document/mcp_open_tools/feishu-cli-let-ai-actually-do-your-work-in-feishu
  webhooks: https://open.larksuite.com/document/server-docs/event-subscription-guide/event-subscription-configure-/request-url-configuration-case
  rate_limits: https://open.larksuite.com/document/server-docs/getting-started/api-access-frequency-control

checks:
  self_serve_signup:
    status: supported
    evidence: https://www.larksuite.com
    verified: "2026-07-07"
    notes: Team sign-up is self-serve from the homepage; developer console access follows from any account.

  api_key_self_serve:
    status: supported
    evidence: https://open.larksuite.com/document/faq/trouble-shooting/how-to-obtain-app-access-token
    verified: "2026-07-07"
    notes: Creating a custom app in the developer console yields app_id/app_secret self-serve; tokens are exchanged via API.

  oauth_support:
    status: supported
    evidence: https://open.larksuite.com/document/uAjLw4CM/ukTMukTMukTM/reference/authen-v1/authorize/get
    verified: "2026-07-07"
    notes: OAuth authorization-code flow for user_access_token.

  scoped_tokens:
    status: supported
    evidence: https://open.larksuite.com/document/server-docs/application-scope/introduction
    verified: "2026-07-07"
    notes: Apps request granular API scopes that admins approve; tokens carry only granted scopes.

  token_revocation:
    status: unknown
    notes: App secrets can be reset in the developer console; needs a docs link as evidence.

  sandbox_or_test_mode:
    status: unknown
    notes: Developer documentation mentions test companies/sandbox tenants; needs the canonical docs link as evidence.

  free_tier_or_trial:
    status: supported
    evidence: https://www.larksuite.com/en_us/plans
    verified: "2026-07-07"
    notes: Free Starter plan; open platform APIs available on it.

  self_serve_paid_upgrade:
    status: unknown
    notes: Pro plan pricing is published; whether upgrade completes without sales contact is unverified.

  usage_dashboard:
    status: unknown

  idempotency:
    status: unknown

  versioning_policy:
    status: unknown
    notes: Endpoints are path-versioned (v1/v2...); no formal deprecation policy page recorded yet.

  automation_permitted:
    status: supported
    evidence: https://open.larksuite.com/document/home/index
    verified: "2026-07-07"
    notes: The open platform exists to build bots and integrations against workspace data.

catalog:
  version: 1
  classifications:
    - productivity-storage/collaborative-tables
  sources:
    api:
      url: https://open.larksuite.com/document/server-docs/docs/bitable-v1/app/create.md
      checked_on: '2026-09-08'
      kind: official_docs
      notes: >-
        Fetched official Markdown successfully: creates a Base with tenant/user token and
        base:app:create or bitable:app permission.
    cli:
      url: https://github.com/larksuite/cli
      checked_on: '2026-09-08'
      kind: official_repo
    mcp:
      url: https://github.com/larksuite/lark-openapi-mcp
      checked_on: '2026-09-08'
      kind: official_repo
    pricing:
      url: https://www.larksuite.com/en_us/plans
      checked_on: '2026-09-08'
      kind: official_site
  routes:
    - id: base-api
      docs: https://open.larksuite.com/document/server-docs/docs/bitable-v1/app/create.md
      interface: api
      maintainer: official
      entry_url: https://open.larksuite.com/document/server-docs/docs/bitable-v1/app/create
      evidence:
        - api
        - cli
      availability:
        value: self_serve
        evidence:
          - cli
      personal_access:
        value: unknown
        evidence:
          - cli
      auth:
        value: platform_credentials
        evidence:
          - cli
      capabilities:
        records.organize:
          value: documented
          evidence:
            - cli
        records.track:
          value: documented
          evidence:
            - cli
      notes: >-
        Requires a platform app, authorized identity and Base scopes/resource permissions.
        Ordinary-person onboarding from a fresh account is not tested.
      costs:
        - kind: free_allowance
          amount: 2000
          unit: rows
          per: table
          scope: Starter Base table limit; access still depends on tenant/app scopes.
          evidence:
            - pricing
      requirements:
        payment_method:
          value: not_required
          evidence:
            - pricing
    - id: official-cli
      docs: https://github.com/larksuite/cli
      interface: cli
      maintainer: official
      entry_url: https://github.com/larksuite/cli
      evidence:
        - cli
      availability:
        value: self_serve
        evidence:
          - cli
      personal_access:
        value: unknown
        evidence:
          - cli
      auth:
        value: platform_credentials
        evidence:
          - cli
      capabilities:
        records.organize:
          value: documented
          evidence:
            - cli
        records.track:
          value: documented
          evidence:
            - cli
      notes: >-
        Official CLI covers Base and supports individuals. Account signup, app creation and
        permission setup still need separate verification.
    - id: official-mcp
      docs: https://github.com/larksuite/lark-openapi-mcp
      interface: mcp
      maintainer: official
      entry_url: https://github.com/larksuite/lark-openapi-mcp
      evidence:
        - mcp
      availability:
        value: self_serve
        evidence:
          - mcp
      personal_access:
        value: unknown
        evidence:
          - mcp
      auth:
        value: platform_credentials
        evidence:
          - mcp
      capabilities:
        records.organize:
          value: documented
          evidence:
            - mcp
        records.track:
          value: documented
          evidence:
            - mcp
      notes: >-
        Local official MCP package uses platform app credentials; identity and tenant domains must
        match.
  notes:
    - International larksuite.com service. Do not transfer Feishu China results to this identity.
