id: jina
name: Jina AI
category: web-search-data
homepage: https://jina.ai
summary: Search-foundation APIs (Reader for URL-to-markdown, embeddings, reranker, deep search) with an official remote MCP server, an agent-targeted llms.txt, and a keyless trial path.
submitted_by: community

tags:
  - search
  - embeddings
  - web-reader

entrypoints:
  docs: https://docs.jina.ai
  api_reference: https://docs.jina.ai
  llms_txt: https://docs.jina.ai/llms.txt
  status_page: https://status.jina.ai
  signup: https://jina.ai/api-dashboard
  api_keys: https://jina.ai/api-dashboard
  mcp_official: https://github.com/jina-ai/MCP

checks:
  self_serve_signup:
    status: supported
    evidence: https://jina.ai/api-dashboard
    verified: "2026-07-08"

  api_key_self_serve:
    status: supported
    evidence: https://jina.ai/api-dashboard
    verified: "2026-07-08"
    notes: Dashboard issues keys; a starter token quota works without registration for some endpoints (r.jina.ai).

  oauth_support:
    status: unknown

  scoped_tokens:
    status: unknown

  token_revocation:
    status: unknown

  sandbox_or_test_mode:
    status: unknown
    notes: Rate-limited keyless access to Reader serves as a de facto trial; needs the canonical docs link as evidence.

  free_tier_or_trial:
    status: supported
    evidence: https://jina.ai/api-dashboard
    verified: "2026-07-08"
    notes: Free token allowance for new keys.

  self_serve_paid_upgrade:
    status: supported
    evidence: https://jina.ai/api-dashboard
    verified: "2026-07-08"
    notes: Prepaid token packs purchasable self-serve.

  usage_dashboard:
    status: supported
    evidence: https://jina.ai/api-dashboard
    verified: "2026-07-08"

  idempotency:
    status: unknown

  versioning_policy:
    status: unknown

  automation_permitted:
    status: unknown
    evidence: https://jina.ai/legal/#terms-and-conditions
    verified: "2026-10-08"
    notes: Terms section 4.3 leaves output use unrestricted unless otherwise agreed, subject to third-party rights. Section 4.5(iv) contains a broad automated-extraction restriction; read with the Reader product description. No benchmark-specific disclosure prohibition was found.

catalog:
  version: 1
  classifications:
    - web-search-data/web-extraction
  sources:
    existing-docs:
      url: https://jina.ai/api-dashboard
      checked_on: '2026-07-08'
      kind: official_site
    reader-docs:
      url: https://jina.ai/reader/
      checked_on: '2026-10-08'
      kind: official_docs
    terms:
      url: https://jina.ai/legal/#terms-and-conditions
      checked_on: '2026-10-08'
      kind: official_site
  routes:
    - id: reader-api
      interface: api
      maintainer: official
      entry_url: https://r.jina.ai/
      docs: https://jina.ai/reader/
      evidence:
        - reader-docs
        - terms
      availability:
        value: self_serve
        evidence:
          - reader-docs
      personal_access:
        value: documented
        evidence:
          - reader-docs
      requirements:
        platform_account:
          value: not_required
          evidence:
            - reader-docs
        payment_method:
          value: not_required
          evidence:
            - reader-docs
      capabilities:
        web.fetch:
          value: documented
          evidence:
            - reader-docs
      notes: >-
        Prefix a public URL with https://r.jina.ai/ for rendered Markdown; basic keyless usage is free at
        20 requests/minute. Keyed token allowances and limits are separate. Default rendering supports
        JavaScript; X-Engine: direct instead uses plain HTTP. A URL may be cached for five minutes;
        X-No-Cache: true or X-Cache-Tolerance: 0 requests fresh content. X-Token-Budget rejects oversized
        requests rather than silently truncating them. No universal page-byte limit or caller-country
        eligibility list was established here. Target-site restrictions and content rights still apply;
        this route does not document a blanket redistribution license or successful extraction trial.
      auth:
        value: none
        evidence:
          - reader-docs
      costs:
        - kind: usage
          amount: 0
          unit: money
          currency: USD
          per: request
          scope: Basic keyless Reader at the documented rate limit; not a keyed token allowance.
          evidence:
            - reader-docs
