id: e2b
name: E2B
category: cloud-hosting
homepage: https://e2b.dev
summary: Isolated cloud sandboxes for running AI-generated code, with llms.txt, an official MCP server, and self-serve keys.
submitted_by: community

tags:
  - sandboxes
  - code-execution
  - agents

entrypoints:
  docs: https://e2b.dev/docs
  llms_txt: https://e2b.dev/llms.txt
  status_page: https://status.e2b.dev
  pricing: https://e2b.dev/pricing
  signup: https://e2b.dev
  api_keys: https://e2b.dev/docs/api-key
  cli: https://e2b.dev/docs/cli
  sdks: https://e2b.dev/docs/sdk-reference
  mcp_official: https://github.com/e2b-dev/mcp-server

checks:
  self_serve_signup:
    status: supported
    evidence: https://e2b.dev
    verified: "2026-07-07"
    notes: Sign-up is self-serve from the homepage; the dashboard URL redirect-loops for unauthenticated probes.

  api_key_self_serve:
    status: supported
    evidence: https://e2b.dev/docs/api-key
    verified: "2026-07-07"

  oauth_support:
    status: unknown
    notes: API keys are the standard auth.

  scoped_tokens:
    status: unknown

  token_revocation:
    status: unknown
    notes: Keys manageable in the dashboard; needs a docs link as evidence.

  sandbox_or_test_mode:
    status: not_applicable
    notes: The product itself is an isolated, ephemeral sandbox per session.

  free_tier_or_trial:
    status: supported
    evidence: https://e2b.dev/pricing
    verified: "2026-10-08"
    notes: Hobby has a one-time $100 usage credit without a credit card, not recurring free compute. Usage is metered; up to 20 concurrent sandboxes and a one-hour session limit.

  self_serve_paid_upgrade:
    status: supported
    evidence: https://e2b.dev/pricing
    verified: "2026-07-07"

  usage_dashboard:
    status: unknown

  idempotency:
    status: unknown

  versioning_policy:
    status: unknown

  automation_permitted:
    status: supported
    evidence: https://e2b.dev/docs
    verified: "2026-07-07"
    notes: Running agent-generated code is the product's stated purpose.

catalog:
  version: 1
  classifications:
    - cloud-hosting/code-sandboxes
  sources:
    existing-docs:
      url: https://e2b.dev/docs/api-key
      checked_on: '2026-07-07'
      kind: official_docs
    quickstart:
      url: https://docs.e2b.dev/quickstart
      checked_on: '2026-10-08'
      kind: official_docs
    files:
      url: https://docs.e2b.dev/quickstart/upload-download-files
      checked_on: '2026-10-08'
      kind: official_docs
    lifecycle:
      url: https://docs.e2b.dev/sandbox
      checked_on: '2026-10-08'
      kind: official_docs
    pricing:
      url: https://e2b.dev/pricing
      checked_on: '2026-10-08'
      kind: official_site
    terms:
      url: https://e2b.dev/terms
      checked_on: '2026-10-08'
      kind: official_site
  routes:
    - id: sandbox-sdk
      interface: sdk
      maintainer: official
      entry_url: https://docs.e2b.dev/quickstart
      docs: https://docs.e2b.dev/quickstart
      evidence: [quickstart]
      availability:
        value: self_serve
        evidence: [quickstart]
      personal_access:
        value: documented
        evidence: [pricing, terms]
        notes: Hobby signup is documented; reviewed terms describe a GitHub-linked account. Current email-only signup eligibility and acceptance of any particular email domain are unverified.
      auth:
        value: api_key
        evidence: [quickstart]
      requirements:
        platform_account:
          value: required
          evidence: [quickstart]
        payment_method:
          value: not_required
          evidence: [pricing]
          notes: Initial Hobby credits only; this does not establish a perpetual free allowance or an account-level spending cap.
      capabilities:
        code.execute:
          value: documented
          evidence: [quickstart, files]
      notes: Python and TypeScript code-interpreter SDKs create a hosted sandbox, execute code, and transfer files through files.write/read. Set a finite timeout and explicitly kill the sandbox after retrieving outputs. The free-credit offer does not establish this project's account balance or actual cash charge; runtime and allocated resources remain metered.
  notes:
    - The reviewed terms contain no express benchmark-publication ban. Prohibited Conduct item 9 requires prior written consent for developing third-party applications interacting with the Website or Services; items 3 and 10 concern competing services or competitive website use. Official quickstart separately instructs developers to write SDK clients. This review does not resolve the broad application's-consent clause for a new evaluation client and does not equate absence of a benchmark ban with permission. No hosted test was performed in this research pass.
