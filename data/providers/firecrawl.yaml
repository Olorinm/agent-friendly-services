id: firecrawl
name: Firecrawl
category: web-search-data
homepage: https://www.firecrawl.dev
summary: Web scraping and crawling API that turns websites into LLM-ready markdown, with an official MCP server.
submitted_by: community

tags:
  - scraping
  - crawling
  - markdown

entrypoints:
  docs: https://docs.firecrawl.dev
  api_reference: https://docs.firecrawl.dev/api-reference/introduction
  llms_txt: https://docs.firecrawl.dev/llms.txt
  pricing: https://www.firecrawl.dev/pricing
  signup: https://www.firecrawl.dev/signin/signup
  api_keys: https://docs.firecrawl.dev/introduction
  sdks: https://docs.firecrawl.dev/sdks/overview
  mcp_official: https://docs.firecrawl.dev/mcp-server
  rate_limits: https://docs.firecrawl.dev/rate-limits

checks:
  self_serve_signup:
    status: supported
    evidence: https://www.firecrawl.dev/pricing
    verified: "2026-07-07"

  api_key_self_serve:
    status: supported
    evidence: https://docs.firecrawl.dev/introduction
    verified: "2026-07-07"

  oauth_support:
    status: supported
    evidence: https://docs.firecrawl.dev/mcp-server
    verified: "2026-10-08"
    notes: Hosted MCP documents OAuth separately from keyless and API-key access.

  scoped_tokens:
    status: unknown

  token_revocation:
    status: unknown

  sandbox_or_test_mode:
    status: unknown
    notes: Free credits serve as a low-risk trial; no separate sandbox documented.

  free_tier_or_trial:
    status: supported
    evidence: https://www.firecrawl.dev/pricing
    verified: "2026-07-07"
    notes: Free plan with monthly credits.

  self_serve_paid_upgrade:
    status: supported
    evidence: https://www.firecrawl.dev/pricing
    verified: "2026-07-07"

  usage_dashboard:
    status: unknown

  idempotency:
    status: not_applicable
    notes: Scrape/crawl jobs are re-runnable reads; no state mutation to protect.

  versioning_policy:
    status: unknown

  automation_permitted:
    status: unknown
    evidence: https://www.firecrawl.dev/terms-of-service
    verified: "2026-10-08"
    notes: Terms require express authorization for commercial purposes and compliance with third-party rights; a free quota alone does not establish every permitted use.

catalog:
  version: 1
  classifications:
    - web-search-data/web-extraction
    - web-search-data/web-search
  sources:
    docs:
      url: https://docs.firecrawl.dev/features/search
      checked_on: '2026-09-07'
      kind: official_docs
    pricing:
      url: https://www.firecrawl.dev/pricing
      checked_on: '2026-10-08'
      kind: official_site
    scrape-docs:
      url: https://docs.firecrawl.dev/features/scrape
      checked_on: '2026-10-08'
      kind: official_docs
    scrape-reference:
      url: https://docs.firecrawl.dev/api-reference/endpoint/scrape
      checked_on: '2026-10-08'
      kind: official_docs
    rate-limits:
      url: https://docs.firecrawl.dev/rate-limits
      checked_on: '2026-10-08'
      kind: official_docs
    terms:
      url: https://www.firecrawl.dev/terms-of-service
      checked_on: '2026-10-08'
      kind: official_site
  routes:
    - id: public-search-api
      docs: https://docs.firecrawl.dev/features/search
      interface: api
      maintainer: official
      entry_url: https://docs.firecrawl.dev/features/search
      evidence:
        - docs
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - docs
      auth:
        value: none
        evidence:
          - docs
      capabilities:
        web.search:
          value: documented
          evidence:
            - docs
        web.fetch:
          value: unknown
          notes: >-
            This route records query-based Search and optional content from its results; it does not establish
            specified-URL extraction. See the separately documented Scrape route.
      notes: >-
        Current search docs explicitly permit starting without a key. Anonymous quota is unquantified; account
        free credits cannot be assumed for this route.
    - id: account-search-api
      docs: https://docs.firecrawl.dev/features/search
      interface: api
      maintainer: official
      entry_url: https://docs.firecrawl.dev/features/search
      evidence:
        - docs
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - docs
      auth:
        value: api_key
        evidence:
          - docs
      capabilities:
        web.search:
          value: documented
          evidence:
            - docs
        web.fetch:
          value: unknown
          notes: >-
            This route records query-based Search and optional content from its results; it does not establish
            specified-URL extraction. See the separately documented Scrape route.
      notes: 'Search: 2 credits per 10 results; extra scraping can consume credits.'
      requirements:
        payment_method:
          value: not_required
          evidence:
            - pricing
      costs:
        - kind: free_allowance
          amount: 1000
          unit: credits
          per: month
          scope: Account Free plan; separate from anonymous access.
          evidence:
            - pricing
    - id: public-scrape-api
      interface: api
      maintainer: official
      entry_url: https://api.firecrawl.dev/v2/scrape
      docs: https://docs.firecrawl.dev/features/scrape
      evidence:
        - scrape-docs
        - scrape-reference
        - rate-limits
        - terms
      availability:
        value: self_serve
        evidence:
          - scrape-docs
      personal_access:
        value: documented
        evidence:
          - scrape-docs
      requirements:
        platform_account:
          value: not_required
          evidence:
            - rate-limits
        payment_method:
          value: not_required
          evidence:
            - rate-limits
      capabilities:
        web.fetch:
          value: documented
          evidence:
            - scrape-docs
      notes: >-
        POST one URL with formats such as markdown. Free keyless access has separate daily per-IP request
        and credit limits, with no published numerical ceilings; either limit can return 429. Keyless access
        excludes batch scrape and the separate Extract endpoint. Scrape renders JavaScript, defaults to a
        two-day cache (maxAge: 172800000), and accepts maxAge: 0 for a fresh fetch. Timeout is 1–300 seconds,
        default 60. Fetch location defaults to the US; this is not a caller-country eligibility guarantee.
        A returned 403/404 page is not evidence of useful extraction. Terms restrict commercial use without
        express authorization. No task success or content redistribution permission is inferred.
      auth:
        value: none
        evidence:
          - scrape-docs
      costs:
        - kind: usage
          amount: 0
          unit: money
          currency: USD
          per: request
          scope: Keyless Scrape within anonymous daily limits; account credits do not quantify these limits.
          evidence:
            - rate-limits
    - id: account-scrape-api
      interface: api
      maintainer: official
      entry_url: https://api.firecrawl.dev/v2/scrape
      docs: https://docs.firecrawl.dev/features/scrape
      evidence:
        - scrape-docs
        - pricing
        - rate-limits
        - terms
      availability:
        value: self_serve
        evidence:
          - scrape-docs
      personal_access:
        value: documented
        evidence:
          - pricing
      auth:
        value: api_key
        evidence:
          - scrape-docs
      requirements:
        platform_account:
          value: required
          evidence:
            - scrape-docs
        payment_method:
          value: not_required
          evidence:
            - pricing
      capabilities:
        web.fetch:
          value: documented
          evidence:
            - scrape-docs
      costs:
        - kind: free_allowance
          amount: 1000
          unit: credits
          per: month
          scope: Shared Free account allowance across endpoints, not an additional Scrape allowance.
          evidence:
            - pricing
      notes: >-
        Free accounts receive 1000 credits/month without a card, 10 Scrape requests/minute and two concurrent
        browsers. Standard Scrape costs one credit/page, including cache hits; advanced options such as JSON
        extraction can cost more. Failed requests without results are not charged, but returned 403/404 pages
        can consume a credit. The public-scrape-api route records anonymous limits separately. Free access
        does not override the commercial-use restriction or rights in the target page.
