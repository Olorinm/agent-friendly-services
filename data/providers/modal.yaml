id: modal
name: Modal
category: cloud-hosting
homepage: https://modal.com
summary: Serverless compute for Python with first-class Sandboxes for agent code execution, llms.txt, and an official CLI.
submitted_by: community

tags:
  - serverless
  - sandboxes
  - gpu

entrypoints:
  docs: https://modal.com/docs
  api_reference: https://modal.com/docs/reference
  llms_txt: https://modal.com/llms.txt
  changelog: https://modal.com/docs/reference/changelog
  status_page: https://status.modal.com
  pricing: https://modal.com/pricing
  signup: https://modal.com/signup
  api_keys: https://modal.com/docs/reference/cli
  cli: https://modal.com/docs/reference/cli
  agent_docs: https://modal.com/docs/guide/sandbox

checks:
  self_serve_signup:
    status: supported
    evidence: https://modal.com/signup
    verified: "2026-07-07"

  api_key_self_serve:
    status: supported
    evidence: https://modal.com/docs/reference/cli
    verified: "2026-07-07"
    notes: "Tokens are created self-serve via the CLI: modal token new."

  oauth_support:
    status: unknown

  scoped_tokens:
    status: unknown
    notes: Workspace-level tokens; finer scoping not confirmed from docs.

  token_revocation:
    status: unknown
    notes: Tokens manageable in workspace settings; needs a docs link as evidence.

  sandbox_or_test_mode:
    status: supported
    evidence: https://modal.com/docs/guide/sandbox
    verified: "2026-07-07"
    notes: Sandboxes are a first-class product feature for isolated code execution.

  free_tier_or_trial:
    status: supported
    evidence: https://modal.com/pricing
    verified: "2026-10-08"
    notes: Starter includes $30 per month in compute credits, but current billing documentation requires a payment method on file before use (https://modal.com/docs/guide/billing). Free credits are not a no-card route or a spending cap.

  self_serve_paid_upgrade:
    status: supported
    evidence: https://modal.com/pricing
    verified: "2026-07-07"

  usage_dashboard:
    status: unknown
    notes: Dashboard shows usage and spend; needs a docs link as evidence.

  idempotency:
    status: unknown

  versioning_policy:
    status: unknown

  automation_permitted:
    status: supported
    evidence: https://modal.com/docs/guide/sandbox
    verified: "2026-07-07"
    notes: Running agent/generated workloads is a documented, first-class use case.

catalog:
  version: 1
  classifications:
    - cloud-hosting/code-sandboxes
  sources:
    existing-docs:
      url: https://modal.com/docs/reference/cli
      checked_on: '2026-07-07'
      kind: official_docs
    sandboxes:
      url: https://modal.com/docs/guide/sandboxes
      checked_on: '2026-10-08'
      kind: official_docs
    pricing:
      url: https://modal.com/pricing
      checked_on: '2026-10-08'
      kind: official_site
    billing:
      url: https://modal.com/docs/guide/billing
      checked_on: '2026-10-08'
      kind: official_docs
    signup:
      url: https://modal.com/signup
      checked_on: '2026-10-08'
      kind: official_site
    terms:
      url: https://modal.com/legal/terms
      checked_on: '2026-10-08'
      kind: official_site
  routes:
    - id: sandbox-sdk
      interface: sdk
      maintainer: official
      entry_url: https://modal.com/docs/guide/sandboxes
      docs: https://modal.com/docs/guide/sandboxes
      evidence: [sandboxes]
      availability:
        value: self_serve
        evidence: [signup, sandboxes]
      personal_access:
        value: documented
        evidence: [pricing]
        notes: Starter targets independent developers; current signup offers GitHub, Google and SSO. Direct email signup was not established by the public page.
      auth:
        value: platform_credentials
        evidence: [existing-docs]
      requirements:
        platform_account:
          value: required
          evidence: [signup]
        payment_method:
          value: required
          evidence: [billing]
      capabilities:
        code.execute:
          value: documented
          evidence: [sandboxes]
      notes: Official SDK Sandbox.create/exec provides remote process execution and stdout retrieval. Sandboxes default to a five-minute lifetime, configurable up to 24 hours; terminate(wait=True) waits for termination. Persistent Volumes and snapshots have separate lifecycles. Starter credits offset metered use and do not mean every workload costs zero.
  notes:
    - Current billing requires a payment method, even with Starter credits. A free-registration-only project cannot assume it can start compute without one. This is a documented preparation requirement, not an observed execution failure.
    - Reviewed May 2026 SaaS terms limit access to internal business purposes and impose ordinary use/confidentiality restrictions; no explicit benchmark-publication prohibition was identified in that document. This bounded review does not establish permission for unrelated redistribution or competing services.
