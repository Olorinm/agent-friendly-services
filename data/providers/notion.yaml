  routes:
    - id: rest-api
      docs: https://developers.notion.com/guides/get-started/internal-connections
      interface: api
      maintainer: official
      entry_url: https://api.notion.com/v1
      evidence:
        - api
        - create-database
      availability:
        value: self_serve
        evidence:
          - api
      personal_access:
        value: documented
        evidence:
          - pat
          - internal-connections
      auth:
        value: api_key
        evidence:
          - internal-connections
          - pat
      capabilities:
        records.organize:
          value: documented
          evidence:
            - create-database
            - create-row
        records.track:
          value: documented
          evidence:
            - query-rows
            - update-row
      notes: >-
        Current API version 2026-03-11 uses separate database, data_source and page objects. Creating a
        database also creates its first table view; initial_data_source.properties defines columns, and
        page properties provide editable rows. Subsequent row creation/query uses the data_source ID,
        while page updates use the page ID. Internal connections need explicit access to the parent page
        plus read/insert/update capabilities; a new token has no page access by default. PATs use their
        creator's permissions, and only workspace owners can create API PATs on Free. Free single-member
        workspaces have unlimited blocks. Multi-member Free workspaces have a 1,000 lifetime-block cap;
        internal-connection block-creating writes fail after the grace period, and deleting content does
        not replenish the allowance. This API enforcement does not apply to PATs, but is not permission
        to bypass plan restrictions. Free connections allow 180 requests per 60 seconds; a separate
        workspace-wide rate limit can also apply. Documented capability does not establish test success
        or permission to publish an evaluation under every account's terms.
      human_steps:
        - stage: credentials
          step: >-
            A workspace owner creates an internal connection with the required content capabilities and
            grants an empty parent page, or creates a PAT with Notion API access in a dedicated workspace.
            Existing credentials still require checking resource access and available Free-plan capacity.
          evidence:
            - internal-connections
            - capabilities
            - pat
            - workspace-block-limits
      costs:
        - kind: free_allowance
          amount: 0
          unit: money
          currency: USD
          per: month
          scope: >-
            Free workspace subscription; single-member unlimited blocks, with separate limits for
            multi-member Free workspaces. API rate limits and resource permissions still apply.
          evidence:
            - pricing
            - request-limits
            - workspace-block-limits
