id: notion
name: Notion
category: productivity-storage
homepage: https://www.notion.com
summary: Connected workspace with a versioned REST API, capability-scoped integrations, llms.txt, and an official MCP server.
submitted_by: community
scope: "Notion API integrations; the editor product itself is not assessed."

tags:
  - docs
  - workspace
  - knowledge-base

entrypoints:
  docs: https://developers.notion.com
  api_reference: https://developers.notion.com/reference/intro
  llms_txt: https://developers.notion.com/llms.txt
  status_page: https://status.notion.so
  pricing: https://www.notion.com/pricing
  signup: https://www.notion.com/signup
  api_keys: https://developers.notion.com/guides/get-started/authorization
  mcp_official: https://developers.notion.com/docs/mcp
  rate_limits: https://developers.notion.com/reference/request-limits
  errors: https://developers.notion.com/reference/status-codes

checks:
  self_serve_signup:
    status: supported
    evidence: https://www.notion.com/signup
    verified: "2026-07-07"

  api_key_self_serve:
    status: supported
    evidence: https://developers.notion.com/guides/get-started/internal-connections
    verified: "2026-10-08"
    notes: Workspace owners can create internal connection tokens; explicit page access is a separate step.

  oauth_support:
    status: supported
    evidence: https://developers.notion.com/docs/authorization
    verified: "2026-07-07"
    notes: OAuth flow for public integrations.

  scoped_tokens:
    status: partial
    evidence: https://developers.notion.com/reference/capabilities
    verified: "2026-10-08"
    notes: Internal connections have separate read/update/insert capabilities and page grants; PATs instead use the creator's page permissions.

  token_revocation:
    status: unknown
    notes: Integrations can be removed in settings; needs a docs link as evidence.

  sandbox_or_test_mode:
    status: unknown
    notes: Free workspaces serve as test environments; no separate sandbox documented.

  free_tier_or_trial:
    status: supported
    evidence: https://www.notion.com/pricing
    verified: "2026-10-08"

  self_serve_paid_upgrade:
    status: supported
    evidence: https://www.notion.com/pricing
    verified: "2026-07-07"

  usage_dashboard:
    status: unknown

  idempotency:
    status: unknown

  versioning_policy:
    status: supported
    evidence: https://developers.notion.com/reference/versioning
    verified: "2026-10-08"
    notes: Required Notion-Version header; current version is 2026-03-11. Database and data_source objects have been separate since 2025-09-03.

  automation_permitted:
    status: unknown
    evidence: https://notion.notion.site/Terms-Conditions-4e1c5dd3e3de45dfa4a8ed60f1a43da0
    verified: "2026-10-08"
    notes: >-
      API automation is documented, but applicable account terms matter. The current MSA section 2.1(9)
      requires prior written consent for evaluation, benchmarking or comparative analysis intended for
      publication. Pure personal use is directed to separate Personal Use Terms; do not infer either a
      blanket publication permission or a blanket ban for all free personal workspaces.

