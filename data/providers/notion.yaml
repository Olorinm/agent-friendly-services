          - mcp
      capabilities:
        records.organize:
          value: documented
          evidence:
            - mcp
        records.track:
          value: documented
          evidence:
            - mcp
      notes: >-
        Official hosted MCP requires interactive OAuth. Token-based open-source server is no longer actively
        maintained.
