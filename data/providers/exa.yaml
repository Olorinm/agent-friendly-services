id: exa
name: Exa
category: web-search-data
homepage: https://exa.ai
summary: Search API built for AI — semantic web search, content retrieval, and research endpoints with an official MCP server.
submitted_by: community

tags:
  - search
  - retrieval
  - rag

entrypoints:
  docs: https://docs.exa.ai
  api_reference: https://docs.exa.ai/reference/getting-started
  llms_txt: https://docs.exa.ai/llms.txt
  changelog: https://docs.exa.ai/changelog
  pricing: https://exa.ai/pricing
  signup: https://dashboard.exa.ai
  api_keys: https://docs.exa.ai/reference/getting-started
  sdks: https://docs.exa.ai/sdks/typescript-sdk-specification
  mcp_official: https://github.com/exa-labs/exa-mcp-server
  rate_limits: https://docs.exa.ai/reference/rate-limits

checks:
  self_serve_signup:
    status: supported
    evidence: https://dashboard.exa.ai
    verified: "2026-07-07"

  api_key_self_serve:
    status: supported
    evidence: https://docs.exa.ai/reference/getting-started
    verified: "2026-07-07"

  oauth_support:
    status: unknown
    notes: API-key auth only, as far as documented.

  scoped_tokens:
    status: unknown

  token_revocation:
    status: unknown
    notes: Keys manageable in dashboard; needs a docs link as evidence.

  sandbox_or_test_mode:
    status: unknown
    notes: Free credits serve as a low-risk trial; no separate sandbox documented.

  free_tier_or_trial:
    status: supported
    evidence: https://exa.ai/pricing
    verified: "2026-07-07"
    notes: Free starter credits.

  self_serve_paid_upgrade:
    status: supported
    evidence: https://exa.ai/pricing
    verified: "2026-07-07"

  usage_dashboard:
    status: unknown
    notes: Dashboard shows usage; needs a docs link as evidence.

  idempotency:
    status: not_applicable
    notes: Read-only search/retrieval API; requests are inherently repeatable.

  versioning_policy:
    status: unknown

  automation_permitted:
    status: unknown
    notes: ToS not yet reviewed.

catalog:
  version: 1
  classifications:
    - web-search-data/web-search
  sources:
    mcp:
      url: https://exa.ai/docs/reference/exa-mcp
      checked_on: '2026-09-07'
      kind: official_docs
    pricing:
      url: https://exa.ai/pricing
      checked_on: '2026-09-07'
      kind: official_site
    docs:
      url: https://exa.ai/docs/reference/search
      checked_on: '2026-09-07'
      kind: official_docs
  routes:
    - id: public-mcp
      interface: mcp
      maintainer: official
      entry_url: https://mcp.exa.ai/mcp
      docs: https://exa.ai/docs/reference/exa-mcp
      evidence:
        - mcp
      availability:
        value: self_serve
        evidence:
          - mcp
      personal_access:
        value: documented
        evidence:
          - mcp
      auth:
        value: none
        evidence:
          - mcp
      capabilities:
        web.search:
          value: documented
          evidence:
            - mcp
        web.fetch:
          value: documented
          evidence:
            - mcp
      notes: >-
        Public search MCP has a casual-use free plan; own key lifts limits. Additional agent_run tool requires
        authentication and separate usage charges; it is excluded from this pilot. API signup credits are not
        a quota guarantee for anonymous MCP.
    - id: search-api
      docs: https://exa.ai/docs/reference/search
      interface: api
      maintainer: official
      entry_url: https://exa.ai/docs/reference/search
      evidence:
        - docs
        - pricing
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - docs
      auth:
        value: api_key
        evidence:
          - docs
      capabilities:
        web.search:
          value: documented
          evidence:
            - docs
      notes: >-
        Free account signup advertised at USD 20 initial credits plus USD 10/month; onboarding may be needed
        for part of initial credits. No payment method required. Anonymous MCP quota is separate.
      requirements:
        payment_method:
          value: not_required
          evidence:
            - pricing
      costs:
        - kind: free_allowance
          amount: 20
          unit: money
          per: one_time
          scope: Published signup credits; some may require onboarding. Actual account award should be checked.
          evidence:
            - pricing
          currency: USD
        - kind: free_allowance
          amount: 10
          unit: money
          per: month
          scope: Free account monthly allowance, not anonymous MCP quota.
          evidence:
            - pricing
          currency: USD
