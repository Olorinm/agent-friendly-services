      checked_on: '2026-10-10'
      kind: official_docs
      notes: Engineering status describes the hosted service as Beta-ready on 2026-08-26 and records public announcement separately. This is a status signal, not confirmation of current GA or contractual Beta status.
  routes:
    - id: ephemeral-api
      interface: api
      maintainer: official
      entry_url: https://neon.new/
      evidence: [launchpad, launchpad-guide]
      availability:
        value: unknown
        evidence: [launchpad]
        notes: Page advertises provisioning while announcing sunset in favor of Claimable Neon. This legacy route was not called; its replacement is recorded separately as claimable-api.
      personal_access: {value: documented, evidence: [launchpad]}
      auth: {value: none, evidence: [launchpad]}
      capabilities:
        database.provision: {value: documented, evidence: [launchpad]}
        database.persist: {value: documented, evidence: [launchpad-guide]}
      notes: No-account, 72-hour ephemeral hosted Postgres. Tests can establish short-term persistence only; this is not a permanent free production database. Connection strings and claim URLs are private credentials.
    - id: claimable-api
      interface: api
      maintainer: official
      entry_url: https://claimable.neon.tech/v1/agent/identity
      docs: https://neon.com/docs/reference/claimable-neon
      evidence:
        - claimable
        - claimable-docs
        - claimable-auth
      availability:
        value: self_serve
        evidence:
          - claimable
      personal_access:
        value: documented
        evidence:
          - claimable
      auth:
        value: none
        evidence:
          - claimable
          - claimable-docs
        notes: No preexisting account or key at provisioning; an issued identity assertion is exchanged for Bearer tokens to retrieve scoped database credentials.
      requirements:
        platform_account:
          value: not_required
          evidence:
            - claimable
        payment_method:
          value: not_required
          evidence:
            - claimable
      capabilities:
        database.provision:
          value: documented
          evidence:
            - claimable-docs
        database.persist:
          value: documented
          evidence:
            - claimable-docs
      costs: []
      notes: >-
        Anonymous provisioning creates a real hosted Postgres project. Its returned database URL works
        with standard Postgres clients; identity assertions, tokens and connection URLs are private.
        The 100 MB storage and 1 GB transfer allowances apply to the whole unclaimed project, not each
        logical database. Multiple databases within that project share these limits and the same
        project.expires_at; they are not separately provisioned free projects.
        These limits and the no-payment-details signup condition do not provide a separate published
        Claimable cash-price rule; the registered Free plan's $0 price must not be substituted for it.
        The project expires after 72 hours unless claimed into a Neon organization. A claim code lasts
        15 minutes and is a different clock. Short-term persistence does not establish a permanent free
        account. Claiming rotates credentials and must not occur between write and independent read.
        The provisioned Postgres connection supports SQL transactions. Its pooler uses transaction mode;
        ordinary short transactions are compatible, while session state across separate transactions
        must not be assumed. Individually committed writes are not an atomic multi-step import.
        Official backup guidance uses pg_dump/pg_restore over a direct, unpooled Postgres connection.
        Creating a separate logical target requires the current role's database-creation rights;
        documented neon_superuser privileges do not prove the permissions of an issued connection.
        A new logical database shares the existing project's capacity and expiry. Claimable's
        engineering Beta status signal and the AUP's publication exception require separate review
        before a new public comparison; callable provisioning is not publication permission.
  notes:
    - >-
      Ordinary registered Free accounts currently include 100 projects, 100 CU-hours/month/project,
      1 GB Postgres storage/project and 10 branches/project, with no credit card required. The storage
      increase was announced on 2026-10-02. These ordinary Free limits do not replace the unclaimed
      Claimable project's 100 MB, 1 GB transfer and 72-hour constraints. Neither plan's advertised
      allowance establishes actual remaining resources or this run's service charges.
    - >-
      The current Neon Platform Schedule incorporates the Databricks MCSA and its Acceptable Use Policy.
      The AUP permits benchmarking and disclosure except for Beta Services, with disclosure of information
      needed to reproduce the benchmark and reciprocal benchmarking rights. The public Claimable reference
      does not label the service Beta, but the official engineering overview describes its hosted endpoint
      as Beta-ready on 2026-08-26. A current Claimable-specific GA confirmation was not established in this
      review; do not infer unrestricted publication from the reference's missing label or from broader
      Neon backend announcements. Customer-content rights and confidentiality obligations remain applicable.
      Small tests using synthetic records should preserve reproducible conditions and disclose only
      task-owned evidence; they do not establish general production reliability.
