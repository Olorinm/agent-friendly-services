id: gitlab
name: GitLab
category: developer-tools
homepage: https://gitlab.com
summary: DevOps platform with REST and GraphQL APIs, scoped tokens, llms.txt, and an official CLI.
submitted_by: community
scope: "gitlab.com SaaS + REST/GraphQL APIs; self-managed GitLab is not assessed."

tags:
  - git
  - ci-cd
  - devops

entrypoints:
  docs: https://docs.gitlab.com
  api_reference: https://docs.gitlab.com/api/rest/
  graphql: https://docs.gitlab.com/api/graphql/
  openapi: https://docs.gitlab.com/api/openapi/openapi_interactive
  llms_txt: https://docs.gitlab.com/llms.txt
  mcp_official: https://docs.gitlab.com/user/gitlab_duo/model_context_protocol/mcp_server
  changelog: https://about.gitlab.com/releases/
  status_page: https://status.gitlab.com
  pricing: https://about.gitlab.com/pricing/
  api_keys: https://docs.gitlab.com/user/profile/personal_access_tokens/
  cli: https://gitlab.com/gitlab-org/cli
  webhooks: https://docs.gitlab.com/user/project/integrations/webhooks/
  rate_limits: https://docs.gitlab.com/security/rate_limits/

checks:
  self_serve_signup:
    status: supported
    evidence: https://about.gitlab.com/pricing/
    verified: "2026-07-07"
    notes: Free-tier signup is self-serve; the signup page itself blocks HEAD probes, so the pricing page serves as evidence.

  api_key_self_serve:
    status: supported
    evidence: https://docs.gitlab.com/user/profile/personal_access_tokens/
    verified: "2026-07-07"

  oauth_support:
    status: supported
    evidence: https://docs.gitlab.com/api/oauth2/
    verified: "2026-07-07"

  scoped_tokens:
    status: supported
    evidence: https://docs.gitlab.com/user/profile/personal_access_tokens/
    verified: "2026-07-07"
    notes: Personal, project, and group access tokens with documented scopes.

  token_revocation:
    status: supported
    evidence: https://docs.gitlab.com/user/profile/personal_access_tokens/
    verified: "2026-07-07"

  sandbox_or_test_mode:
    status: unknown
    notes: No dedicated API sandbox; free accounts and throwaway groups are commonly used for testing.

  free_tier_or_trial:
    status: supported
    evidence: https://about.gitlab.com/pricing/
    verified: "2026-07-07"

  self_serve_paid_upgrade:
    status: supported
    evidence: https://about.gitlab.com/pricing/
    verified: "2026-07-07"

  usage_dashboard:
    status: unknown

  idempotency:
    status: unknown

  versioning_policy:
    status: supported
    evidence: https://docs.gitlab.com/api/rest/
    verified: "2026-07-07"
    notes: Stable v4 REST API with a documented deprecation and removals process.

  automation_permitted:
    status: supported
    evidence: https://handbook.gitlab.com/handbook/legal/api-terms/
    verified: "2026-10-08"
    notes: API Terms section 1.1 permits developing, testing and supporting integrations, subject to documentation, rate limits and truthful identity. Section 1.3.7 separately restricts API comparisons and performance disclosure; see catalog notes for the unresolved agreement-coverage distinction.
catalog:
  version: 1
  classifications:
    - developer-tools/code-hosting
    - productivity-storage/project-management
  sources:
    classification-docs:
      url: https://docs.gitlab.com/user/
      checked_on: '2026-09-15'
      kind: official_docs
    repository-files:
      url: https://docs.gitlab.com/api/repository_files/
      checked_on: '2026-10-08'
      kind: official_docs
    terms-index:
      url: https://about.gitlab.com/terms/
      checked_on: '2026-10-08'
      kind: official_site
    api-terms:
      url: https://handbook.gitlab.com/handbook/legal/api-terms/
      checked_on: '2026-10-08'
      kind: official_site
    subscription-agreement:
      url: https://handbook.gitlab.com/handbook/legal/subscription-agreement/
      checked_on: '2026-10-08'
      kind: official_site
    acceptable-use:
      url: https://handbook.gitlab.com/handbook/legal/acceptable-use-policy/
      checked_on: '2026-10-08'
      kind: official_site
  routes: []
  notes:
    - >-
      Repository/merge-request work and issue/epic tracking are separate supported scopes. SaaS and
      self-managed access must be distinguished.
    - >-
      Public repository file reads are documented without authentication and can select a branch,
      tag or commit. This establishes a personal read path, not permission to publish a comparison
      or proof of zero service cost. No business API request or account registration was performed
      in this documentation review.
    - >-
      API Terms section 1.3.7 restricts competitive analysis and dissemination of API or Software
      performance information, including uptime, response time and benchmarks. Separately, the current
      Subscription Agreement section 5.2 says benchmark testing and comparative analysis are not
      prohibited. API Terms preamble F gives an applicable Software or partnership agreement priority
      where inconsistent; the terms index distinguishes public API use from Software use. Whether the
      proposed anonymous public-API study falls under that override was not established. This project
      therefore holds the proposed public API comparison, without claiming a universal GitLab testing
      ban or a technical service failure. Ordinary integration access remains subject to rate limits,
      accurate identity, intellectual-property rights and the Acceptable Use Policy.
