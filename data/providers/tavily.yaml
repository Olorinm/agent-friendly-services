id: tavily
name: Tavily
category: web-search-data
homepage: https://www.tavily.com
summary: Search and extraction for AI agents, with free rate-limited keyless API/MCP access and a separate keyed account allowance.
submitted_by: community

tags:
  - search
  - rag
  - agents

entrypoints:
  docs: https://docs.tavily.com
  api_reference: https://docs.tavily.com/documentation/api-reference/introduction
  llms_txt: https://docs.tavily.com/llms.txt
  status_page: https://status.tavily.com
  pricing: https://www.tavily.com/pricing
  signup: https://app.tavily.com
  api_keys: https://docs.tavily.com/documentation/quickstart
  sdks: https://docs.tavily.com/sdk
  mcp_official: https://docs.tavily.com/documentation/mcp
  rate_limits: https://docs.tavily.com/documentation/rate-limits

checks:
  self_serve_signup:
    status: supported
    evidence: https://app.tavily.com
    verified: "2026-07-07"

  api_key_self_serve:
    status: supported
    evidence: https://docs.tavily.com/documentation/quickstart
    verified: "2026-07-07"

  oauth_support:
    status: unknown
    notes: API keys are the standard auth.

  scoped_tokens:
    status: unknown

  token_revocation:
    status: unknown
    notes: Keys manageable in the app dashboard; needs a docs link as evidence.

  sandbox_or_test_mode:
    status: unknown
    notes: Free monthly credits serve as a low-risk trial; no separate sandbox documented.

  free_tier_or_trial:
    status: supported
    evidence: https://www.tavily.com/pricing
    verified: "2026-07-07"
    notes: Free plan with monthly API credits.

  self_serve_paid_upgrade:
    status: supported
    evidence: https://www.tavily.com/pricing
    verified: "2026-07-07"

  usage_dashboard:
    status: unknown

  idempotency:
    status: not_applicable
    notes: Read-only search/extract API; requests are inherently repeatable.

  versioning_policy:
    status: unknown

  automation_permitted:
    status: unknown
    evidence: https://www.tavily.com/terms
    verified: "2026-10-08"
    notes: Platform terms section 3.2(x) restrict disclosure of service performance information or analysis to third parties. Documented API access does not establish permission to publish a benchmark.

catalog:
  version: 1
  classifications:
    - web-search-data/web-extraction
    - web-search-data/web-search
  sources:
    docs:
      url: https://docs.tavily.com/documentation/quickstart
      checked_on: '2026-10-08'
      kind: official_docs
    pricing:
      url: https://docs.tavily.com/documentation/api-credits
      checked_on: '2026-10-08'
      kind: official_docs
    keyless:
      url: https://docs.tavily.com/documentation/keyless
      checked_on: '2026-10-08'
      kind: official_docs
    rate-limits:
      url: https://docs.tavily.com/documentation/rate-limits
      checked_on: '2026-10-08'
      kind: official_docs
    extract-docs:
      url: https://docs.tavily.com/documentation/api-reference/endpoint/extract
      checked_on: '2026-10-08'
      kind: official_docs
    terms:
      url: https://www.tavily.com/terms
      checked_on: '2026-10-08'
      kind: official_site
  routes:
    - id: keyless-search-api
      interface: api
      maintainer: official
      entry_url: https://api.tavily.com/search
      docs: https://docs.tavily.com/documentation/keyless
      evidence:
        - keyless
      availability:
        value: self_serve
        evidence:
          - keyless
      personal_access:
        value: documented
        evidence:
          - keyless
      auth:
        value: none
        evidence:
          - keyless
      requirements:
        platform_account:
          value: not_required
          evidence:
            - keyless
        payment_method:
          value: not_required
          evidence:
            - keyless
      capabilities:
        web.search:
          value: documented
          evidence:
            - keyless
      costs:
        - kind: usage
          amount: 0
          unit: money
          currency: USD
          per: request
          scope: Free keyless Search, subject to rate limits; the numerical allowance is not published here.
          evidence:
            - keyless
      notes: >-
        Requires X-Tavily-Access-Mode: keyless. The publisher documents the standard Search parameters and
        response schema. A valid Authorization key takes precedence and uses account limits instead, so
        keyless access must be recorded separately from preconfigured credentials. No task success is implied.
    - id: public-mcp
      interface: mcp
      maintainer: official
      entry_url: https://mcp.tavily.com/mcp/
      docs: https://docs.tavily.com/documentation/keyless
      evidence:
        - keyless
      availability:
        value: self_serve
        evidence:
          - keyless
      personal_access:
        value: documented
        evidence:
          - keyless
      auth:
        value: none
        evidence:
          - keyless
      requirements:
        platform_account:
          value: not_required
          evidence:
            - keyless
      capabilities:
        web.search:
          value: documented
          evidence:
            - keyless
        web.fetch:
          value: documented
          evidence:
            - keyless
      notes: >-
        Free rate-limited Search and Extract require X-Tavily-Access-Mode: keyless; without that header the
        server requests login. Clients that accept only a server URL cannot select this mode. Numerical
        keyless limits are not stated. Crawl, Map and Research require a key and are outside this route.
    - id: search-api
      docs: https://docs.tavily.com/documentation/quickstart
      interface: api
      maintainer: official
      entry_url: https://api.tavily.com/search
      evidence:
        - docs
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - docs
      auth:
        value: api_key
        evidence:
          - docs
      capabilities:
        web.search:
          value: documented
          evidence:
            - docs
      notes: >-
        Basic search costs 1 credit; advanced search 2. Development keys have a 100 requests/minute limit.
        The 1000 credits/month allowance is separate from anonymous access, and is not 1000 advanced searches.
        Paid overage must be enabled separately; a free-only test should check the account setting and balance.
      requirements:
        payment_method:
          value: not_required
          evidence:
            - pricing
      costs:
        - kind: free_allowance
          amount: 1000
          unit: credits
          per: month
          scope: Free account allowance, not requests.
          evidence:
            - pricing
    - id: keyless-extract-api
      interface: api
      maintainer: official
      entry_url: https://api.tavily.com/extract
      docs: https://docs.tavily.com/documentation/keyless
      evidence:
        - keyless
        - extract-docs
        - terms
      availability:
        value: self_serve
        evidence:
          - keyless
      personal_access:
        value: documented
        evidence:
          - keyless
      auth:
        value: none
        evidence:
          - keyless
      requirements:
        platform_account:
          value: not_required
          evidence:
            - keyless
        payment_method:
          value: not_required
          evidence:
            - keyless
      capabilities:
        web.fetch:
          value: documented
          evidence:
            - extract-docs
            - keyless
      costs:
        - kind: usage
          amount: 0
          unit: money
          currency: USD
          per: request
          scope: Free rate-limited keyless Extract; numerical anonymous quota is not published here.
          evidence:
            - keyless
      notes: >-
        POST urls (one URL or up to 20) with X-Tavily-Access-Mode: keyless. A valid Authorization key takes
        precedence and uses account limits. Markdown is the default; basic and advanced depths are available.
        An optional query selects relevant chunks instead of the whole page: chunks_per_source ranges from
        1 to 5, each at most 500 characters. Inspect both results and failed_results even for HTTP 200.
        Timeout ranges from 1 to 60 seconds. Account credits do not quantify anonymous limits. Terms section
        3.2(x) restrict third-party disclosure of performance information or analysis; free technical access
        is not evidence of benchmark publication permission. No extraction trial is implied.
    - id: extract-api
      interface: api
      maintainer: official
      entry_url: https://api.tavily.com/extract
      docs: https://docs.tavily.com/documentation/api-reference/endpoint/extract
      evidence:
        - extract-docs
        - pricing
        - terms
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - docs
      capabilities:
        web.fetch:
          value: documented
          evidence:
            - extract-docs
      notes: >-
        Extract accepts up to 20 supplied URLs. Basic costs one credit per five successful URL extractions;
        advanced costs two. Failed extractions are not charged. The 1000 monthly account credits are shared
        with other endpoints. Query-based chunks and partial failures follow the same schema described under
        keyless-extract-api. Keyed usage and anonymous access are distinct; Search trials do not establish
        extraction success. Terms section 3.2(x) also applies to performance disclosure for this route.
      auth:
        value: api_key
        evidence:
          - extract-docs
      requirements:
        platform_account:
          value: required
          evidence:
            - docs
        payment_method:
          value: not_required
          evidence:
            - pricing
      costs:
        - kind: free_allowance
          amount: 1000
          unit: credits
          per: month
          scope: Shared Free account allowance, not an additional allowance for Extract.
          evidence:
            - pricing
