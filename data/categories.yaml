# Canonical classification tree. Paths may have different depths.
# Categories describe service types; capabilities describe deliverable outcomes.
# Inclusion rules do not require every listed capability or imply any tested result.

categories:
  - id: ai-models
    name: AI Services
    description: >-
      Services for accessing models and generating or processing content; compare access providers using a
      shared model or content services using a specific user task.
    name_zh: AI 服务
    subcategories:
      - id: model-access
        name: Model Access
        name_zh: 模型接入
        description: >-
          Access a model through its provider or an inference/router service. Compare only a shared model
          version and matched request settings; this is not a model-quality leaderboard.
        capabilities:
          - id: models.infer
            description: Obtain an inference response from an identified model.
        inclusion: Accepts inference requests for identifiable models.
        exclusion: >-
          Merely listing models or returning search snippets is insufficient; compare the same model and
          settings.
      - id: speech-synthesis
        name: Speech Synthesis
        name_zh: 语音合成
        description: Generate spoken audio from supplied text.
        inclusion: Returns playable speech corresponding to supplied text.
        exclusion: Transcription and voice-call orchestration alone are separate.
        capabilities:
          - id: speech.synthesize
            description: Produce spoken audio for supplied text.
      - id: speech-recognition
        name: Speech Recognition
        name_zh: 语音识别
        description: Transcribe supplied recordings or live speech.
        inclusion: Returns text derived from supplied speech.
        exclusion: Audio generation and call transport alone do not qualify.
        capabilities:
          - id: speech.transcribe
            description: Return a transcript of supplied speech.
      - id: image-generation
        name: Image Generation
        name_zh: 图像生成
        description: Generate or transform images from a prompt or reference.
        inclusion: Delivers a generated or edited image.
        exclusion: Image search, hosting and vector retrieval alone do not qualify.
        capabilities:
          - id: images.generate
            description: Produce an image from a text or image brief.
      - id: video-generation
        name: Video Generation
        name_zh: 视频生成
        description: Generate video from a prompt or reference media.
        inclusion: Delivers generated video frames as a clip.
        exclusion: Video storage, transcription and playback alone do not qualify.
        capabilities:
          - id: video.generate
            description: Produce a video clip from a creative brief.
    inclusion: Provides model inference or generated/processed content.
    exclusion: A directory of models or agent connectors alone is insufficient.
  - id: agent-tooling
    name: Agent Infrastructure & Automation
    description: Agent memory, tool connections, workflow execution and discovery infrastructure.
    name_zh: Agent 基础设施与自动化
    inclusion: Provides reusable infrastructure for building or operating agents and cross-service automation.
    exclusion: A service exposing an MCP endpoint alone does not belong here.
    subcategories:
      - id: memory
        name: Agent Memory
        name_zh: Agent 记忆
        description: Retain and retrieve agent context across interactions.
        inclusion: Provides persistent memory management and retrieval for an agent.
        exclusion: Raw vector storage alone does not establish a managed memory service.
        capabilities:
          - id: memory.recall
            description: Recover relevant saved context across agent sessions.
      - id: tool-integrations
        name: Tool Connections
        name_zh: 工具连接
        description: Connect an agent to actions in external applications.
        inclusion: Provides callable application actions and connection/authentication management.
        exclusion: A static directory or one product with its own MCP server is insufficient.
        capabilities:
          - id: tools.execute
            description: Execute a selected action in a connected application.
      - id: workflow-automation
        name: Workflow Automation
        name_zh: 工作流自动化
        description: Run repeatable sequences across tools or services.
        inclusion: Defines and executes workflows with triggers or ordered steps.
        exclusion: A single connector or a library of templates without execution is insufficient.
        capabilities:
          - id: workflows.run
            description: Run a defined workflow and retrieve its execution outcome.
  - id: developer-tools
    name: Developer Tools
    description: Code hosting, API development, testing, monitoring and troubleshooting.
    name_zh: 开发工具
    subcategories:
      - id: dependency-advisories
        name: Dependency Security Advisories
        name_zh: 依赖漏洞公告
        description: Find published security advisories for identifiable software packages and interpret their affected and fixed versions.
        inclusion: >-
          Retrieves identifiable public advisories using a package ecosystem, package name, version or
          advisory identifier, with source links and affected-version or remediation metadata where available.
        exclusion: >-
          Source-code analysis, exploit execution, infrastructure scanning and discovering previously unknown
          vulnerabilities are separate. A successful lookup or no match does not establish that software is
          secure, exploitable in a particular application, or free of other vulnerabilities. Aggregators can
          share upstream records; matching answers are not independent security findings.
        capabilities:
          - id: advisories.lookup
            description: Retrieve published dependency advisories and their package/version applicability and documented fixes.
      - id: monitoring
        name: Monitoring & Troubleshooting
        name_zh: 监控与故障排查
        description: Collect and retrieve application errors, logs and performance evidence to diagnose problems.
        capabilities:
          - id: monitoring.diagnose
            description: Retrieve operational evidence for investigating an application problem.
        inclusion: Collects or retrieves operational errors, logs or performance evidence.
        exclusion: A status page alone does not establish an application monitoring service.
      - id: code-hosting
        name: Code Hosting & Review
        name_zh: 代码托管与评审
        description: Host versioned code and collaborate on changes.
        inclusion: Provides repositories and a contribution/review workflow.
        exclusion: Issue tracking alone belongs under project management.
        capabilities:
          - id: code.review
            description: Retrieve proposed code changes and their review context.
      - id: api-development
        name: API Development & Testing
        name_zh: API 开发与测试
        description: Build, organize and test API interactions.
        inclusion: Provides reusable API requests, collections or test execution.
        exclusion: Merely offering a public API does not qualify.
        capabilities:
          - id: api.test
            description: Run an API request collection and report the results.
    inclusion: Supports software development, repository collaboration, API development or operational diagnosis.
    exclusion: Hosting runtime and application storage are classified separately.
  - id: cloud-hosting
    name: Cloud Computing & Hosting
    description: Cloud runtime environments and hosting for code, browsers and applications.
    name_zh: 云计算与托管
    subcategories:
      - id: code-sandboxes
        name: Code Sandboxes
        name_zh: 代码沙箱
        description: Run code and process files in an isolated temporary environment.
        capabilities:
          - id: code.execute
            description: Execute supplied code and return output or produced files.
        inclusion: Runs supplied code in an isolated execution environment.
        exclusion: A model returning code without executing it is insufficient.
      - id: browser-environments
        name: Browser Environments
        name_zh: 浏览器运行环境
        description: Create a remote browser session and execute browser operations.
        capabilities:
          - id: browser.interact
            description: Perform browser interactions in a remote session.
        inclusion: Provides a controllable browser session.
        exclusion: Fetching page text without browser control belongs under web extraction.
      - id: app-hosting
        name: Application Hosting
        name_zh: 应用部署
        description: Deploy a website or application and keep it available at a public endpoint.
        capabilities:
          - id: app.deploy
            description: Deploy an application and return its reachable endpoint.
        inclusion: Deploys an application to an address reachable by its intended users.
        exclusion: Temporary code execution without a deployed application is insufficient.
    inclusion: Provides an environment for running code, browser sessions or deployed applications.
    exclusion: A storage-only service belongs under databases; remote browser execution is not web search.
  - id: databases
    name: Databases
    description: Databases, vector stores, data platforms.
    subcategories:
      - id: hosted-relational
        name: Hosted Relational Databases
        description: Remote SQL storage for personal applications, including temporary development databases.
        capabilities:
          - id: database.provision
            description: Create an isolated hosted database.
          - id: database.persist
            description: Write, update and read data across fresh connections.
          - id: database.restore
            description: Export data and restore it into a separate database or namespace.
        name_zh: 托管关系型数据库
        inclusion: Offers hosted SQL tables and relational queries.
        exclusion: Local-only database files, document-only stores and collaborative work tables are separate.
      - id: vector
        name: Vector Databases
        name_zh: 向量数据库
        description: Store and query data by vector similarity.
        inclusion: Persists indexed vectors and supports similarity queries.
        exclusion: An embedding model alone does not store or search application data.
        capabilities:
          - id: vectors.search
            description: Find stored records similar to a query vector or embedded query.
      - id: document
        name: Document Databases
        name_zh: 文档数据库
        description: Store and query structured application documents.
        inclusion: Provides persistent document collections with field-based queries.
        exclusion: A file drive or metadata attached to vectors alone is insufficient.
        capabilities:
          - id: documents.query
            description: Retrieve stored application documents matching field conditions.
      - id: key-value
        name: Key-value Databases
        name_zh: 键值数据库
        description: Store and retrieve application values by key.
        inclusion: Offers addressable keys and values across calls.
        exclusion: A local cache or temporary execution variable alone does not qualify.
        capabilities:
          - id: kv.persist
            description: Write a value and retrieve it in a later operation.
    name_zh: 数据库
    inclusion: Stores and retrieves application data through a database model.
    exclusion: >-
      User-facing work tables belong under workplace collaboration; third-party datasets belong under data
      access.
  - id: web-search-data
    name: Search & Data Access
    description: Search APIs, crawling and scraping, data providers.
    subcategories:
      - id: scholarly-search
        name: Scholarly Literature Search
        name_zh: 学术文献检索
        description: Find identifiable scholarly works and their bibliographic metadata from publication clues or research queries.
        inclusion: >-
          Searches an identifiable scholarly corpus and returns work identities with citation metadata
          such as title, authors, publication venue, year and persistent identifiers where available.
        exclusion: >-
          General web-page search, guaranteed full-text access, literature-review synthesis and research-quality
          rankings are separate. Corpus coverage and identifier availability vary; citation counts or agreement
          between indexes do not independently establish a paper's identity, quality or completeness.
        capabilities:
          - id: scholarly.search
            description: Find scholarly works with enough bibliographic metadata to identify and cite them.
      - id: web-search
        name: Web Search
        description: Discover relevant public web pages from a query; answers may include source citations.
        capabilities:
          - id: web.search
            description: Return relevant web sources for a query.
        name_zh: 网页搜索
        inclusion: Accepts a topic or query and returns relevant web sources.
        exclusion: Fetching a supplied URL alone is extraction; source snippets do not establish full-page retrieval.
      - id: web-extraction
        name: Web Content Extraction
        name_zh: 网页内容提取
        description: Retrieve specified web pages or sites as usable text or structured data.
        capabilities:
          - id: web.fetch
            description: Retrieve usable source content from specified web URLs.
        inclusion: >-
          Accepts identified web URLs or a specified site and returns its content as usable text or structured
          data.
        exclusion: >-
          Query-only result lists/snippets are web search; browser control is a runtime, not extraction
          itself.
      - id: geocoding
        name: Geocoding
        name_zh: 地理编码
        description: Resolve named places or supplied public addresses to geographic coordinates.
        inclusion: >-
          Returns a geographic position with enough place or address context to identify the match;
          coverage, result granularity and public-endpoint conditions must be specified.
        exclusion: >-
          General web search, weather at known coordinates, map tiles and route navigation are separate.
          A place or building coordinate does not establish an exact entrance, postal deliverability or
          safe navigation to a destination.
        capabilities:
          - id: places.geocode
            description: Resolve a place name or address to an identified geographic position.
      - id: public-holidays
        name: Public Holidays
        name_zh: 公共节假日
        description: Retrieve dated public holidays applicable to an identified country or region for personal planning.
        inclusion: >-
          Returns identifiable holiday dates and names with enough jurisdiction and holiday-type context
          to determine the requested regional scope; supported years and subdivisions must be stated.
        exclusion: >-
          Personal calendar editing, school vacations alone, general web search and extraction from a
          supplied page are separate. Holiday data does not establish shop opening hours, individual
          employment or pay entitlements, bank operations or travel availability; observances and
          substitute dates must not be silently treated as applicable public holidays.
        capabilities:
          - id: holidays.lookup
            description: Retrieve public holiday dates and names for a specified jurisdiction and period.
      - id: weather-data
        name: Weather Data
        name_zh: 天气数据
        description: >-
          Retrieve weather forecasts or observations for an identified location and time, for personal
          planning and weather-aware applications.
        inclusion: >-
          Supplies weather variables with identifiable locations, valid times and units, distinguishing
          forecasts from observations and historical reconstructions.
        exclusion: >-
          Place-name geocoding, general web search and a weather model without a callable data service are
          separate. Forecast access does not establish historical observation access or forecast accuracy;
          those require their own evidence and task conditions.
        capabilities:
          - id: weather.forecast
            description: Retrieve a weather forecast for a specified location and future period.
      - id: financial-data
        name: Financial Data
        name_zh: 金融数据
        description: >-
          Access identifiable financial or economic datasets; select a data type, then match coverage and task
          conditions.
        capabilities: []
        inclusion: >-
          Supplies financial/economic observations or original filings; unresolved dataset scope can remain at
          this parent with an explanation.
        exclusion: >-
          News, trading execution or a generic search API alone does not establish a financial dataset
          service.
        subcategories:
          - id: fx
            name: Exchange Rates
            name_zh: 汇率数据
            description: Retrieve currency-pair exchange rates.
            inclusion: Rates identify the currency pair, direction and observation date.
            exclusion: >-
              A payment conversion fee or asset valuation alone is insufficient; reference rates do not imply
              executable exchange quotes.
            capabilities:
              - id: fx.latest
                description: Retrieve the latest published rate for a currency pair.
              - id: fx.history
                description: Retrieve exchange rates for specified historical dates.
          - id: prices
            name: Asset Prices
            name_zh: 资产行情
            description: Retrieve asset price snapshots or historical series.
            inclusion: Provides prices for identifiable assets and observation times.
            exclusion: >-
              Valuations inside transaction disclosures or news articles alone are insufficient; assets,
              adjustments and entitlements must match.
            capabilities:
              - id: prices.latest
                description: Retrieve a recent price snapshot for an identified asset.
              - id: prices.history
                description: Retrieve a price series for an identified asset and period.
          - id: statements
            name: Company Financials
            name_zh: 公司财务数据
            description: Retrieve company financial statements or reported financial facts.
            inclusion: >-
              Financial values identify the company, reporting period and units, or link to the original
              statement.
            exclusion: Company profiles, market prices or valuation ratios alone are insufficient.
            capabilities:
              - id: statements.read
                description: Retrieve company financial values with reporting periods, units and source context.
          - id: disclosures
            name: Transaction Disclosures
            name_zh: 交易披露
            description: Retrieve publicly reported transactions.
            inclusion: >-
              Records identify the reporting party and distinguish disclosure from transaction timing where
              available.
            exclusion: >-
              Company annual reports alone are not transaction disclosures; congressional and insider filings
              are different populations.
            capabilities:
              - id: disclosures.search
                description: Retrieve public transaction disclosures matching a person, asset or period.
          - id: macro
            name: Economic Indicators
            name_zh: 宏观经济指标
            description: Retrieve named economic indicator series.
            inclusion: Observations identify the series, periods and units.
            exclusion: >-
              Market asset prices alone are not macro indicators; frequency, seasonality and revisions must
              match.
            capabilities:
              - id: macro.series
                description: Retrieve economic observations for a named series and period.
    name_zh: 搜索与数据获取
    inclusion: Discovers external information or supplies usable source content or datasets.
    exclusion: Storage of user-supplied application data is a database; a general model API alone is not a data source.
  - id: payments-billing
    name: Payments / Billing
    description: Payments, billing, subscription infrastructure.
    subcategories:
      - id: accept-payments
        name: Payment Acceptance
        description: >-
          Accept customer payments for products or services; alternatives depend on merchant eligibility,
          geography and the task.
        capabilities:
          - id: payments.checkout
            description: Prepare a customer checkout for a specified product and price.
          - id: payments.status
            description: Determine whether an order has actually been paid.
          - id: payments.subscription
            description: Prepare recurring collection for a subscription offering.
        name_zh: 收款
        inclusion: Enables a merchant to collect customer payments for a product or service.
        exclusion: >-
          A payment link directory or paid API consumption alone is insufficient; merchant eligibility remains
          separate.
    name_zh: 支付与计费
    inclusion: Provides payment collection or billing infrastructure.
    exclusion: Retrieving financial data or accepting payment for its own API does not qualify.
  - id: communication
    name: Communication
    description: Email, SMS, chat, notifications.
    subcategories:
      - id: mailboxes
        name: Mailboxes
        name_zh: 邮箱
        description: >-
          Mailboxes for receiving and managing email; temporary and persistent accounts have different
          retention and access conditions.
        capabilities:
          - id: mailboxes.provision
            description: Obtain a mailbox and retain access for subsequent use.
          - id: mailboxes.read
            description: Find and read the intended incoming email.
        inclusion: Provides a mailbox with later access to received email.
        exclusion: >-
          Sending email alone and single callback notifications are insufficient; retention and mailbox
          ownership must match.
      - id: email-delivery
        name: Email Delivery
        name_zh: 邮件发送
        description: Send application email to recipients.
        inclusion: Provides programmatic email delivery and delivery outcomes.
        exclusion: Mailbox provisioning and incoming-email reading alone do not qualify.
        capabilities:
          - id: email.send
            description: Deliver an email to specified recipients and retrieve its delivery status.
      - id: messaging
        name: Messaging
        name_zh: 即时通讯
        description: Read and send messages in conversations or channels.
        inclusion: Exposes conversation/channel messaging operations.
        exclusion: SMS transport and passive social-data retrieval are separate.
        capabilities:
          - id: messages.send
            description: Send a message to an authorized conversation.
          - id: messages.read
            description: Retrieve messages from an authorized conversation.
      - id: sms
        name: SMS Delivery
        name_zh: 短信发送
        description: Send and receive carrier text messages.
        inclusion: Provides delivery to phone-number recipients over SMS.
        exclusion: In-app chat messages and number verification alone are insufficient.
        capabilities:
          - id: sms.send
            description: Send an SMS to a specified phone number.
      - id: voice-calls
        name: Voice Calls
        name_zh: 语音通话
        description: Establish and handle live voice calls.
        inclusion: Provides live calling or a voice agent that can participate in calls.
        exclusion: Speech synthesis/transcription alone does not establish calling.
        capabilities:
          - id: calls.connect
            description: Establish an authorized live voice call.
      - id: voice-agents
        name: Voice Agents
        name_zh: 语音 Agent
        description: Operate conversational agents over live voice.
        inclusion: Orchestrates listening, response generation and speech in an interactive session.
        exclusion: A standalone speech model or telephony transport alone is insufficient.
        capabilities:
          - id: voice.converse
            description: Conduct a live voice conversation with an agent.
    name_zh: 通信
    inclusion: Enables email, messaging or live voice communication.
    exclusion: Text-to-speech alone is an AI content service, not communication delivery.
  - id: productivity-storage
    name: Workplace Collaboration
    description: >-
      Documents, collaborative tables, project management and file sharing; application object storage belongs
      under cloud services.
    subcategories:
      - id: collaborative-tables
        name: Collaborative Tables
        description: User-facing online tables for organizing and following up shared work.
        capabilities:
          - id: records.organize
            description: Turn supplied notes into a structured online action list.
          - id: records.track
            description: Update progress and retrieve outstanding actions.
          - id: records.reconcile
            description: Merge follow-up notes without duplicating existing actions.
        name_zh: 协作表格
        inclusion: Provides user-facing shared tables with structured records.
        exclusion: A backend database without collaborative work-table features is insufficient.
      - id: project-management
        name: Project & Task Management
        name_zh: 项目与任务管理
        description: Track work items, ownership and progress.
        inclusion: Provides durable tasks/issues and their status in a shared work context.
        exclusion: Code storage and free-form documents alone are insufficient.
        capabilities:
          - id: tasks.track
            description: Retrieve and update assigned work and progress.
      - id: document-collaboration
        name: Document Collaboration
        name_zh: 文档协作
        description: Create, edit and share working documents.
        inclusion: Provides collaborative document content and access.
        exclusion: Files stored without document editing are file sharing; JSON document storage is a database.
        capabilities:
          - id: docs.collaborate
            description: Create or update a shared working document.
      - id: file-sharing
        name: File Sharing
        name_zh: 文件共享
        description: Store, organize and share user files.
        inclusion: Provides user file/folder storage and sharing controls.
        exclusion: Object storage used only as an application backend is separate.
        capabilities:
          - id: files.share
            description: Store a file and grant intended recipients access.
    name_zh: 办公协作
    inclusion: Organizes shared work, documents, tasks or files for people.
    exclusion: Application database and object-storage APIs alone are not office collaboration.
  - id: commerce-marketing
    name: E-commerce
    description: Services for building and operating online stores.
    name_zh: 电商
    inclusion: Operates an online store, including products, inventory, carts or orders.
    exclusion: Payment processing alone belongs under payments; no store subcategory is asserted from one provider.
    capabilities:
      - id: store.catalog
        description: Maintain the products and variants offered by an online store.
      - id: store.orders
        description: Retrieve and follow up store orders and fulfillment status.
  - id: travel
    name: Travel
    description: Services for planning and purchasing travel as an individual.
    subcategories:
      - id: flights
        name: Flights
        description: Flight offers, fare comparison, purchase links and ticketing.
        capabilities:
          - id: flights.search
            description: Search itineraries and fares matching travel constraints.
          - id: flights.reprice
            description: Recheck a selected offer's current price and availability.
          - id: flights.booking-link
            description: Return a link for purchasing a selected offer.
          - id: flights.ticketing
            description: Issue a ticket, beyond search or a purchase link.
        name_zh: 机票
        inclusion: Returns flight offers or supports their purchase or ticketing.
        exclusion: >-
          Airport information, schedules or status without offers are insufficient; ticket issuance is
          separately documented.
      - id: hotels
        name: Hotels
        description: Hotel availability, room offers and reservations; tasks not defined yet.
        capabilities: []
        name_zh: 酒店
        inclusion: Returns room availability/offers or supports hotel reservations.
        exclusion: >-
          Hotel descriptions or reviews alone are insufficient. This branch has no researched candidate set or
          frozen task yet.
    name_zh: 旅行
    inclusion: Finds or arranges travel inventory for individual travelers.
    exclusion: Generic map, weather or payment services alone do not qualify.
