# Canonical category list. category remains the primary category for legacy
# consumers. catalog.classifications may contain multiple category/subcategory
# paths. Capability ids describe outcomes, not API methods or interface types.

categories:
  - id: ai-models
    name: AI Models
    description: Model and inference APIs (LLMs, embeddings, media generation).

  - id: agent-tooling
    name: Agent Tooling
    description: Agent infrastructure, MCP tooling, orchestration services.

  - id: code-execution
    name: Code Execution
    description: Code sandboxes, ephemeral compute, browser automation.

  - id: developer-tools
    name: Developer Tools
    description: Code hosting, CI, testing, API tooling, error tracking.

  - id: cloud-hosting
    name: Cloud / Hosting
    description: Clouds, deployment platforms, edge and serverless hosting.

  - id: databases
    name: Databases
    description: Databases, vector stores, data platforms.
    subcategories:
      - id: hosted-relational
        name: Hosted Relational Databases
        description: Remote SQL storage for personal applications, including temporary development databases.
        capabilities:
          - id: database.provision
            description: Create an isolated hosted database.
          - id: database.persist
            description: Write, update and read data across fresh connections.
          - id: database.restore
            description: Export data and restore it into a separate database or namespace.

  - id: web-search-data
    name: Web Search / Data
    description: Search APIs, crawling and scraping, data providers.
    subcategories:
      - id: web-search
        name: Web Search
        description: Discover web sources and retrieve evidence for user questions.
        capabilities:
          - id: web.search
            description: Return relevant web sources for a question.
          - id: web.fetch
            description: Retrieve source content supporting an answer.

  - id: payments-billing
    name: Payments / Billing
    description: Payments, billing, subscription infrastructure.

  - id: communication
    name: Communication
    description: Email, SMS, chat, notifications.

  - id: productivity-storage
    name: Productivity / Storage
    description: Project management, documents, file storage.
    subcategories:
      - id: collaborative-tables
        name: Collaborative Tables
        description: User-facing online tables for organizing and following up shared work.
        capabilities:
          - id: records.organize
            description: Turn supplied notes into a structured online action list.
          - id: records.track
            description: Update progress and retrieve outstanding actions.
          - id: records.reconcile
            description: Merge follow-up notes without duplicating existing actions.

  - id: observability-security
    name: Observability / Security
    description: Monitoring, logging, identity, security services.

  - id: commerce-marketing
    name: Commerce / Marketing
    description: CMS, e-commerce, CRM, marketing platforms.

  - id: travel
    name: Travel
    description: Services for planning and purchasing travel as an individual.
    subcategories:
      - id: flights
        name: Flights
        description: Flight offers, fare comparison, purchase links and ticketing.
        capabilities:
          - id: flights.search
            description: Search itineraries and fares matching travel constraints.
          - id: flights.reprice
            description: Recheck a selected offer's current price and availability.
          - id: flights.booking-link
            description: Return a link for purchasing a selected offer.
          - id: flights.ticketing
            description: Issue a ticket, beyond search or a purchase link.
      - id: hotels
        name: Hotels
        description: Hotel availability, room offers and reservations; tasks not defined yet.
        capabilities: []
