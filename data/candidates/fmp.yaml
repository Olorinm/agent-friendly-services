id: fmp
name: Financial Modeling Prep (FMP)
category: web-search-data
homepage: https://financialmodelingprep.com/
summary: >-
  Stock prices, financial statements, FX, crypto and congressional disclosures through a keyed API
  and official MCP.
submitted_by: community
tags:
  - stocks
  - financials
  - fx
  - crypto
  - disclosures
catalog:
  version: 1
  classifications:
    - web-search-data/financial-data/prices
    - web-search-data/financial-data/statements
    - web-search-data/financial-data/fx
    - web-search-data/financial-data/disclosures
  sources:
    docs:
      url: https://site.financialmodelingprep.com/developer/docs
      checked_on: '2026-09-09'
      kind: official_docs
    access:
      url: https://site.financialmodelingprep.com/developer/docs/pricing
      checked_on: '2026-09-15'
      kind: official_docs
    mcp:
      url: https://site.financialmodelingprep.com/developer/docs/mcp-server
      checked_on: '2026-09-09'
      kind: official_docs
  routes:
    - id: data-api
      interface: api
      maintainer: official
      entry_url: https://site.financialmodelingprep.com/developer/docs
      docs: https://site.financialmodelingprep.com/developer/docs
      evidence:
        - docs
        - access
      availability:
        value: self_serve
        evidence:
          - docs
          - access
      personal_access:
        value: documented
        evidence:
          - docs
          - access
      auth:
        value: api_key
        evidence:
          - docs
          - access
      notes: >-
        Basic is free with 250 calls/day and end-of-day/profile/reference features. Annual fundamentals are
        listed under paid Starter; a free key does not establish access to the fiscal-year comparison task.
        Displaying or redistributing FMP data requires a separate licensing agreement according to its pricing
        page.
    - id: data-mcp
      interface: mcp
      maintainer: official
      entry_url: https://financialmodelingprep.com/mcp
      docs: https://site.financialmodelingprep.com/developer/docs/mcp-server
      evidence:
        - mcp
      availability:
        value: self_serve
        evidence:
          - mcp
      personal_access:
        value: documented
        evidence:
          - mcp
      auth:
        value: api_key
        evidence:
          - mcp
      notes: >-
        Uses the existing API key and plan limits; key must be injected privately, never stored in the URL in
        public results.
