      url: https://www.openholidaysapi.org/en/
      checked_on: '2026-10-08'
      kind: official_docs
    openapi:
      url: https://openholidaysapi.org/swagger/v1/swagger.json
      checked_on: '2026-10-08'
      kind: official_docs
    faq:
      url: https://www.openholidaysapi.org/en/faq/
      checked_on: '2026-10-08'
      kind: official_docs
    data-licence:
      url: https://github.com/openpotato/openholidaysapi.data/blob/main/LICENSE
      checked_on: '2026-10-08'
      kind: official_repo
    regional-sources:
      url: https://www.openholidaysapi.org/en/sources-europe/#germany
      checked_on: '2026-10-08'
