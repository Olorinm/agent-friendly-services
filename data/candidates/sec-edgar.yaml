id: sec-edgar
name: SEC EDGAR Data APIs
category: web-search-data
homepage: https://www.sec.gov/
summary: >-
  Official public company filings and XBRL financial facts; data.sec.gov reading APIs require no
  account or key.
submitted_by: community
tags:
  - financials
  - filings
catalog:
  version: 1
  classifications:
    - web-search-data/financial-data/statements
  sources:
    docs:
      url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
      checked_on: '2026-10-08'
      kind: official_docs
    fair-access:
      url: https://www.sec.gov/about/webmaster-frequently-asked-questions
      checked_on: '2026-10-08'
      kind: official_docs
    access:
      url: https://www.sec.gov/search-filings/edgar-search-assistance/accessing-edgar-data
      checked_on: '2026-10-08'
      kind: official_docs
  routes:
    - id: data-api
      interface: api
      maintainer: official
      entry_url: https://data.sec.gov/
      docs: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
      evidence:
        - docs
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - docs
      auth:
        value: none
        evidence:
          - docs
      capabilities:
        statements.read:
          value: documented
          evidence:
            - docs
          notes: Company filings and XBRL facts; reporting periods, units and amendments need interpretation.
      notes: >-
        Public reading APIs require no account or key. Fair access requires an identifying User-Agent
        with contact information and no more than 10 requests/second. Companyfacts and submissions
        support financial facts and filing provenance. Frames align to calendar periods and do not
        substitute for each company's fiscal year; units, duration, filing cutoff and amendments need
        interpretation. CORS is not supported. Filer submission APIs are separate.
      requirements:
        platform_account:
          value: not_required
          evidence:
            - docs
      costs:
        - kind: usage
          amount: 0
          unit: money
          currency: USD
          per: request
          scope: Public EDGAR data access, subject to SEC fair-access policy.
          evidence:
            - access
