id: sec-edgar
name: SEC EDGAR Data APIs
category: web-search-data
homepage: https://www.sec.gov/
summary: >-
  Official public company filings and XBRL financial facts; data.sec.gov reading APIs require no account
  or key.
submitted_by: community
tags:
  - financials
  - filings
catalog:
  version: 1
  classifications:
    - web-search-data/financial-data
  sources:
    docs:
      url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
      checked_on: '2026-09-09'
      kind: official_docs
  routes:
    - id: data-api
      interface: api
      maintainer: official
      entry_url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
      docs: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
      evidence:
        - docs
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - docs
      auth:
        value: none
        evidence:
          - docs
