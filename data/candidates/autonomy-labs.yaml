    verified: "2026-08-06"
    notes: Instant Stripe checkout with automatic email fulfillment; 12 digital products published.

  usage_dashboard:
    status: not_applicable
    notes: No per-request usage metering.

  idempotency:
    status: not_applicable
    notes: Not an API; purchases are one-time checkout events.

  versioning_policy:
    status: not_applicable
