id: agentmail
name: AgentMail
category: communication
homepage: https://www.agentmail.to/
summary: Dedicated agent inboxes with sending, receiving, threads and API, SDK, CLI and MCP access.
submitted_by: community
tags:
- email
- mailbox
catalog:
  version: 1
  classifications:
  - communication/mailboxes
  sources:
    docs:
      url: https://docs.agentmail.to/quickstart
      checked_on: '2026-09-09'
      kind: official_docs
    pricing:
      url: https://www.agentmail.to/pricing
      checked_on: '2026-09-09'
      kind: official_docs
    onboarding:
      url: https://docs.agentmail.to/agent-onboarding
      checked_on: '2026-09-09'
