id: razorpay
name: Razorpay
homepage: https://razorpay.com/
summary: >-
  Payment Links API for collecting specified amounts through hosted checkout, including a documented test
  mode.
category: payments-billing
submitted_by: community
catalog:
  version: 1
  classifications:
    - payments-billing/accept-payments
  sources:
    checkout:
      url: https://razorpay.com/docs/api/payments/payment-links/create-standard/
      checked_on: '2026-09-08'
      kind: official_docs
  routes:
    - id: payment-links-api
