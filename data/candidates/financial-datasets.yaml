id: financial-datasets
name: Financial Datasets
category: web-search-data
homepage: https://financialdatasets.ai/
summary: >-
  US company financial statements, historical prices, filings and insider trades, with API and an
  official MCP integration; automated onboarding requires prepaid data credits.
submitted_by: community
tags:
  - stocks
  - financials
  - disclosures
catalog:
  version: 1
  classifications:
    - web-search-data/financial-data/prices
    - web-search-data/financial-data/statements
    - web-search-data/financial-data/disclosures
  sources:
    docs:
      url: https://docs.financialdatasets.ai/quickstart
      checked_on: '2026-10-08'
      kind: official_docs
    mcp:
      url: https://docs.financialdatasets.ai/mcp-server
      checked_on: '2026-10-08'
      kind: official_docs
    agent-onboarding:
      url: https://docs.financialdatasets.ai/agents
      checked_on: '2026-10-08'
      kind: official_docs
    provenance:
      url: https://docs.financialdatasets.ai/data-provenance
      checked_on: '2026-10-08'
      kind: official_docs
      notes: >-
        Financial statements are sourced from SEC filings. Dataset provenance does not establish
        free access or the correctness of a particular financial comparison.
  routes:
    - id: data-api
      interface: api
      maintainer: official
      entry_url: https://api.financialdatasets.ai/
      docs: https://docs.financialdatasets.ai/quickstart
      evidence:
        - docs
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - docs
      auth:
        value: api_key
        evidence:
          - docs
      capabilities:
        statements.read:
          value: documented
          evidence:
            - docs
            - provenance
      costs:
        - kind: minimum_spend
          amount: 20
          unit: money
          currency: USD
          per: credit_purchase
          scope: Minimum credit purchase in documented agent onboarding; not a per-request price.
          evidence:
            - agent-onboarding
      notes: >-
        API keys use X-API-KEY. Agent onboarding issues a key but data calls return HTTP 402 until the
        account is funded; the minimum credit purchase is USD 20 and automatic refills are optional.
        Free signup is not free data access. A separate free allowance for ordinary signup has not
        been established, so this is not ready for a free-only batch without account-specific evidence.
    - id: data-mcp
      interface: mcp
      maintainer: official
      entry_url: https://mcp.financialdatasets.ai/
      docs: https://docs.financialdatasets.ai/mcp-server
      evidence:
        - mcp
      availability:
        value: self_serve
        evidence:
          - mcp
      personal_access:
        value: documented
        evidence:
          - mcp
      auth:
        value: oauth
        evidence:
          - mcp
      capabilities:
        statements.read:
          value: documented
          evidence:
            - mcp
      notes: >-
        Interactive clients sign in through OAuth. The connector lists income, balance-sheet,
        cash-flow and filing tools; authentication does not establish a free execution allowance.
    - id: data-mcp-keyed
      interface: mcp
      maintainer: official
      entry_url: https://mcp.financialdatasets.ai/api
      docs: https://docs.financialdatasets.ai/mcp-server
      evidence:
        - mcp
      availability:
        value: self_serve
        evidence:
          - mcp
      personal_access:
        value: documented
        evidence:
          - mcp
      auth:
        value: api_key
        evidence:
          - mcp
      capabilities:
        statements.read:
          value: documented
          evidence:
            - mcp
      notes: >-
        Programmatic MCP uses the /api endpoint with X-API-KEY or Bearer authentication. Annual and
        quarterly statement tools support an as_reported option. Account funding and actual task
        entitlement remain separate from successful connection.
