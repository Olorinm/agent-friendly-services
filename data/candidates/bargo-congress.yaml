notes:
  - >-
    Originally submitted by the vendor in https://github.com/Olorinm/agent-friendly-services/pull/6;
    incorporated during the broader financial-data discovery pass. This record covers the Congress
    product, not Bargo's separate market-intelligence platform; no task result is implied.
  - >-
    The OpenAPI date filters select transaction dates, not disclosure dates; filing_portal points to
    the source filing portal and does not establish a direct link to each original filing. Preserve
    these distinctions when selecting a task or checking provenance.
  - >-
    Free API Terms allow personal applications, agents and analysis with visible Bargo attribution.
    Raw records may not be redistributed, including partial exports; derivative work must not expose
    or reconstruct them. Evidence publication must respect this restriction.
