id: bargo-congress
name: Bargo Congress Trades API
category: web-search-data
homepage: https://www.bargo.ai/free-apis/congress
summary: >-
  Read-only US congressional trade disclosures through a free REST API and keyed MCP; this entry covers
  only the Congress product.
submitted_by: vendor
tags:
  - congress
  - disclosures
catalog:
  version: 1
  classifications:
    - web-search-data/financial-data/disclosures
  sources:
