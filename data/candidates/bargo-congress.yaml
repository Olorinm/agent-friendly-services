      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - free-api-terms
      auth:
        value: api_key
        evidence:
          - docs
      capabilities:
        disclosures.search:
          value: documented
          evidence:
            - docs
          notes: >-
            Documented Congress trade/member tools; tool coverage and output must still satisfy the selected
            task.
      notes: >-
        Uses the free key obtained through Google sign-in. Bearer authentication is documented; no separate
        MCP data or quota allowance is claimed. Verify tool coverage per task.
      costs:
        - kind: free_allowance
          amount: 100
          unit: requests
          per: day
          scope: Free-key allowance across Bargo Free APIs, including REST and MCP.
          evidence:
            - key-dashboard
        - kind: free_allowance
          amount: 1000
          unit: rows
          per: day
          scope: Same free-key allowance; Congress data is limited to a rolling three-month window.
          evidence:
            - docs
            - key-dashboard
      requirements:
        platform_account:
          value: required
          evidence:
            - key-dashboard
          notes: A Google account is required to issue and manage the free key.
        payment_method:
          value: not_required
          evidence:
