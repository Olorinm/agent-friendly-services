      checked_on: '2026-09-15'
      kind: official_docs
    key-dashboard:
      url: https://www.bargo.ai/free-apis/dash
      checked_on: '2026-09-15'
      kind: official_site
    free-api-terms:
      url: https://www.bargo.ai/free-apis/terms
      checked_on: '2026-09-15'
      kind: official_site
  routes:
    - id: congress-api-keyless
      interface: api
      maintainer: official
      entry_url: https://www.bargo.ai/free-apis/congress/v1
      docs: https://www.bargo.ai/free-apis/congress
      evidence:
        - docs
        - openapi
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - free-api-terms
      auth:
        value: none
        evidence:
          - docs
      capabilities:
        disclosures.search:
          value: documented
          evidence:
            - docs
            - openapi
          notes: >-
            US congressional trades; rolling history, date-filter semantics and filing provenance are task
            constraints.
      notes: >-
        Rolling three-month coverage. Preserve transaction and disclosure dates; the Free API Terms require
        attribution and restrict raw-data redistribution.
      costs:
        - kind: free_allowance
          amount: 30
          unit: requests
          per: day
          scope: Keyless quota shared per IP.
          evidence:
            - docs
        - kind: free_allowance
          amount: 100
          unit: rows
          per: day
          scope: Rolling three-month Congress dataset; redistribution restrictions apply.
          evidence:
            - docs
      requirements:
        payment_method:
          value: not_required
          evidence:
            - docs
    - id: congress-api-keyed
      interface: api
      maintainer: official
      entry_url: https://www.bargo.ai/free-apis/congress/v1
      docs: https://www.bargo.ai/free-apis/congress
      evidence:
        - docs
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - free-api-terms
      auth:
        value: api_key
        evidence:
          - docs
      capabilities:
        disclosures.search:
          value: documented
          evidence:
            - docs
          notes: Keyed access to the Congress dataset; a larger quota does not establish broader history.
      notes: >-
        Free keys are issued through Google sign-in. REST accepts Bearer or X-Api-Key authentication;
        regenerating a key invalidates the old one. Signup and key acquisition have not been measured. The
        published quota covers the same key across Bargo Free APIs, not a separate allowance per route.
      costs:
        - kind: free_allowance
          amount: 100
          unit: requests
          per: day
          scope: Free-key allowance across Bargo Free APIs, including REST and MCP.
          evidence:
            - key-dashboard
        - kind: free_allowance
          amount: 1000
          unit: rows
          per: day
          scope: Same free-key allowance; Congress data is limited to a rolling three-month window.
          evidence:
            - docs
            - key-dashboard
      requirements:
        platform_account:
          value: required
          evidence:
            - key-dashboard
          notes: A Google account is required to issue and manage the free key.
        payment_method:
          value: not_required
          evidence:
            - docs
    - id: congress-mcp
      interface: mcp
      maintainer: official
      entry_url: https://www.bargo.ai/free-apis/congress/mcp
