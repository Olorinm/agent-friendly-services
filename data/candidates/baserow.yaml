id: baserow
name: Baserow Cloud
category: productivity-storage
homepage: https://baserow.io/
summary: >-
  Hosted collaborative tables; free workspace and scoped row-access tokens. Schema management uses a
  different credential.
submitted_by: community
catalog:
  version: 1
  classifications:
    - productivity-storage/collaborative-tables
  sources:
    api:
      url: https://baserow.io/docs/apis/rest-api
      checked_on: '2026-09-08'
      kind: official_docs
    auth:
      url: https://baserow.io/user-docs/personal-api-tokens
      checked_on: '2026-09-08'
      kind: official_docs
    pricing:
      url: https://baserow.io/pricing
      checked_on: '2026-09-08'
      kind: official_site
    mcp:
      url: https://baserow.io/user-docs/mcp-server
      checked_on: '2026-09-08'
      kind: official_docs
  routes:
    - id: database-api
      docs: https://baserow.io/docs/apis/rest-api
      interface: api
      maintainer: official
      entry_url: https://baserow.io/docs/apis/rest-api
      evidence:
        - api
      availability:
        value: self_serve
        evidence:
          - api
      personal_access:
        value: documented
        evidence:
          - pricing
      auth:
        value: api_key
        evidence:
          - api
      capabilities:
        records.organize:
          value: documented
          evidence:
            - api
        records.track:
          value: documented
          evidence:
            - api
      notes: >-
        Database token can read/create/update/delete rows in permitted tables; creating the
        table/schema requires a short-lived JWT. A precreated table changes the test setup.
      human_steps:
        - stage: credentials
          step: Generate a database token and select permitted tables and operations.
          evidence:
            - auth
      costs:
        - kind: free_allowance
          amount: 3000
          unit: rows
          per: workspace
          scope: Cloud Free plan. 2 GB storage. JWT/schema access and database row tokens are distinct.
          evidence:
            - pricing
    - id: native-mcp
      docs: https://baserow.io/user-docs/mcp-server
      interface: mcp
      maintainer: official
      entry_url: https://baserow.io/user-docs/mcp-server
      evidence:
        - mcp
      availability:
        value: unknown
        evidence:
          - mcp
      personal_access:
        value: unknown
        evidence:
          - mcp
      auth:
        value: api_key
        evidence:
          - mcp
      capabilities:
        records.organize:
          value: unknown
          evidence:
            - mcp
        records.track:
          value: documented
          evidence:
            - mcp
      notes: >-
        Workspace admin creates a unique secret-bearing endpoint URL; the URL is itself a credential
        and must not be published. Documented tools read schema/list tables and create/update/delete
        rows, but do not list table creation. Cloud plan availability is not yet verified; do not
        assume this route can provision task 001 from an empty container.
      human_steps:
        - stage: credentials
          step: Create a workspace MCP endpoint in account settings and securely store its private URL.
          evidence:
            - mcp
  notes: []
