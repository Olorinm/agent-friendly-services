        - api
      availability:
        value: unknown
      personal_access:
        value: restricted
        evidence:
          - eligibility
        notes: Individual/sole-trader onboarding is documented subject to supported geography and verification.
      notes: >-
        PayFac powered by UniPaaS; merchant retains tax responsibilities. Official materials limit onboarding
        to UK/EU/US merchants. Sandbox and production tokens differ. A 2026-09-08 sandbox-only account and token were prepared successfully. A fresh Codex trial created a
        remote checkout but hit a browser launch permission failure, so it is invalid for completion-rate
        comparison. Independent browser review showed only the checkout shell; customer usability remains unverified.
