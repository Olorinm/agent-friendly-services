id: nominatim
name: Nominatim Public API
category: web-search-data
homepage: https://nominatim.org/
summary: OSMF-hosted place and address lookup for deliberately selected, low-volume uses under its public API policy.
submitted_by: community
tags:
  - geocoding
catalog:
  version: 1
  classifications:
    - web-search-data/geocoding
  sources:
    search-docs:
      url: https://nominatim.org/release-docs/latest/api/Search/
      checked_on: '2026-10-10'
      kind: official_docs
    output-docs:
      url: https://nominatim.org/release-docs/latest/api/Output/
      checked_on: '2026-10-10'
      kind: official_docs
    faq:
      url: https://nominatim.org/release-docs/latest/api/Faq/
      checked_on: '2026-10-10'
      kind: official_docs
    usage-policy:
      url: https://operations.osmfoundation.org/policies/nominatim/
      checked_on: '2026-10-10'
      kind: official_docs
      notes: >-
        Public-instance policy, including LLM-specific conditions, remains applicable. The one-request
        per-second ceiling applies to aggregate application traffic. Small one-time scripted batches
        must use one thread/machine and cache results; repeated identical queries can be blocked.
    service-access:
      url: https://osmfoundation.org/wiki/Services_and_tile_users_privacy_FAQ
      checked_on: '2026-10-10'
      kind: official_site
      notes: >-
        OSMF explicitly lists its Nominatim geocoding service among services supplied free of charge
        to third parties, conditional on usage and privacy policies. This is service-price evidence,
        distinct from the software/data licence or donation-funded hosting.
    terms:
      url: https://osmfoundation.org/wiki/Terms_of_Use
      checked_on: '2026-10-10'
      kind: official_site
    licence:
      url: https://www.openstreetmap.org/copyright
      checked_on: '2026-10-10'
      kind: official_site
    attribution:
      url: https://osmfoundation.org/wiki/Licence/Attribution_Guidelines
      checked_on: '2026-10-10'
      kind: official_docs
  routes:
    - id: public-search-api
      interface: api
      maintainer: official
      upstream: openstreetmap
      entry_url: https://nominatim.openstreetmap.org/search
      docs: https://nominatim.org/release-docs/latest/api/Search/
      evidence: [search-docs, usage-policy]
      availability:
        value: self_serve
        evidence: [usage-policy]
        notes: Limited public OSMF server; self-hosted and third-party Nominatim instances have separate policies.
      personal_access:
        value: documented
        evidence: [usage-policy, terms]
        notes: >-
          Read the public-server policy before choosing this route:
          https://operations.osmfoundation.org/policies/nominatim/ . LLM suggestions must prominently
          link and explain it. The developer must deliberately choose the service and remain responsible
          for compliance; generic no-code, low-code or vibe-coding geocoding backends are prohibited.
          This is not a blanket prohibition of every LLM-assisted single query.
      auth:
        value: none
        evidence: [search-docs, usage-policy]
        notes: Supply a valid application-identifying User-Agent or Referer; stock HTTP-library identities are insufficient.
      capabilities:
        places.geocode:
          value: documented
          evidence: [search-docs, output-docs]
          notes: >-
            GET with a free-form q or structured address fields, not both. Explicitly select an output
            format on the public host; jsonv2 includes lat/lon, display_name and object type. Optional
            addressdetails, language and country filters help interpret a match. Coordinates identify
            an object centroid, not a guaranteed entrance or rooftop.
      requirements:
        platform_account:
          value: not_required
          evidence: [search-docs, usage-policy]
        payment_method:
          value: not_required
          evidence: [usage-policy]
      costs:
        - kind: usage
          amount: 0
          unit: money
          currency: USD
          per: eligible public API request
          scope: OSMF explicitly free public service within its usage/privacy policies; no reserved capacity or SLA.
          evidence: [service-access, usage-policy]
      notes: >-
        Public API policy: https://operations.osmfoundation.org/policies/nominatim/ . Maximum one
        request/second across the application. Small one-time bulk scripts must use one thread on one
        machine and cache results; regular or longer-than-one-day scripts are limited to four
        requests/minute. Autocomplete, systematic harvesting, automated details-page scraping and
        geocoding-result resale are prohibited. Apps must be able to switch service on request. Do not
        submit personal/confidential data. OSMF terms include age and UK sanctions eligibility conditions.
        OSM data use requires attribution and ODbL compliance; derived databases have share-alike
        obligations. No explicit public-benchmark prohibition was found in the reviewed terms.
        Postcodes may be interpolated and address components can come from nearby place nodes;
        coverage or matching text alone does not prove a precise position. Nominatim and Photon share
        OSM data, so agreement between them is not independent geographic truth. The source review
        made no live geocoding request; dated trials separately record network conditions and outcomes.
