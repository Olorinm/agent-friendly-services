      data_kind:
        value: sandbox
        evidence:
          - testing
      auth:
        value: api_key
        evidence:
          - testing
      requirements:
        platform_account:
          value: required
          evidence:
            - testing
      human_steps:
        - step: Use dashboard Test Mode and obtain a test API key.
          stage: credentials
          evidence:
            - testing
entrypoints:
  pricing: https://docs.creem.io/getting-started/introduction
  docs: https://docs.creem.io/getting-started/test-mode
notes:
