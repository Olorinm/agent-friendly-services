      interface: api
      maintainer: official
      entry_url: https://docs.creem.io/getting-started/test-mode
      evidence:
        - testing
      availability:
        value: self_serve
        evidence:
          - testing
      personal_access:
        value: unknown
      notes: >-
        Test mode has separate API keys, products and test-api.creem.io. Production account review includes
