id: creem
name: Creem
homepage: https://www.creem.io/
summary: Digital-product checkout and billing APIs with separate test mode and reviewed merchant accounts.
category: payments-billing
submitted_by: community
catalog:
  version: 1
  classifications:
    - payments-billing/accept-payments
  sources:
    testing:
      url: https://docs.creem.io/getting-started/test-mode
      checked_on: '2026-09-08'
      kind: official_docs
    eligibility:
      url: https://docs.creem.io/merchant-of-record/account-reviews/account-reviews
      checked_on: '2026-09-08'
      kind: official_docs
    pricing:
      url: https://docs.creem.io/getting-started/introduction
      checked_on: '2026-09-08'
      kind: official_docs
  routes:
