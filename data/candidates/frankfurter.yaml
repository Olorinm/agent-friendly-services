id: frankfurter
name: Frankfurter
category: web-search-data
homepage: https://frankfurter.dev/
summary: Public exchange-rate API and official MCP using central-bank reference data, with no API key.
submitted_by: community
tags:
  - fx
catalog:
  version: 1
  classifications:
    - web-search-data/financial-data/fx
  sources:
    docs:
      url: https://frankfurter.dev/
      checked_on: '2026-10-08'
      kind: official_docs
    mcp:
      url: https://frankfurter.dev/mcp/
      checked_on: '2026-10-08'
      kind: official_docs
  routes:
    - id: data-api
      interface: api
      maintainer: official
      entry_url: https://api.frankfurter.dev/v2/
      docs: https://frankfurter.dev/
      evidence:
        - docs
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - docs
      auth:
        value: none
        evidence:
          - docs
      capabilities:
        fx.latest:
          value: documented
          evidence:
            - docs
          notes: Dated currency-pair reference rates; provider selection determines the source series.
        fx.history:
          value: documented
          evidence:
            - docs
          notes: Dated currency-pair reference rates; provider selection determines the source series.
      notes: >-
        The hosted public API is free with no key or daily/monthly quota; abuse rate limits apply. Default v2
        rates blend sources; filter by ECB when the task requires ECB reference data. Reference rates are not
        executable bank/card quotes.
      requirements:
        payment_method:
          value: not_required
          evidence:
            - docs
        platform_account:
          value: not_required
          evidence:
            - docs
      costs:
        - kind: usage
          amount: 0
          unit: money
          currency: USD
          per: public API request
          scope: >-
            Hosted public API under its documented fair-use rate limiting; underlying provider terms still
            apply.
          evidence:
            - docs
    - id: rates-mcp
      interface: mcp
      maintainer: official
      entry_url: https://mcp.frankfurter.dev/
      docs: https://frankfurter.dev/mcp/
      evidence:
        - mcp
      availability:
        value: self_serve
        evidence:
          - mcp
      personal_access:
        value: documented
        evidence:
          - mcp
      auth:
        value: none
        evidence:
          - mcp
      capabilities:
        fx.latest:
          value: documented
          evidence: [mcp]
        fx.history:
          value: documented
          evidence: [mcp]
          notes: Individual historical dates; the guide directs date ranges and bulk data to REST.
      requirements:
        platform_account:
          value: not_required
          evidence: [mcp]
      notes: >-
        Hosted HTTP MCP with conversion, rate, currency and provider tools. The optional provider argument
        selects one institution instead of the default blend. Uses reference rates, not executable payment
        quotes. REST time-series capability must not be assumed for this route.
