id: turso
name: Turso
category: databases
homepage: https://turso.tech/
summary: >-
  Hosted SQLite-compatible Turso and libSQL databases, with a no-card free cloud plan,
  management CLI/API, remote SQL over HTTP and language SDKs.
submitted_by: community

