  routes:
    - id: cloud-cli
      docs: https://docs.turso.tech/quickstart
      interface: cli
      maintainer: official
      entry_url: https://docs.turso.tech/cli/introduction
      evidence:
        - docs
        - pricing
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - docs
      auth:
        value: platform_credentials
        evidence:
          - docs
      capabilities:
        database.provision:
          value: documented
          evidence:
            - cloud-quickstart
        database.persist:
          value: documented
          evidence:
            - cloud-quickstart
      notes: >-
        Free cloud account: 100 databases, 5 GB, 500 million rows read/month and 10 million rows written/month.
        Cloud signup/login is required; the CLI authentication guide documents browser-based GitHub
        login, a headless option, and weekly CLI reauthentication. Choose and record the cloud engine:
        --tursodb creates a Turso database; omitting it creates libSQL. A local engine alone does not
        establish remote persistence. Published allowances do not establish remaining account quota;
        paid overages are separate and must not be assumed disabled. The shell reference documents
        a logical .dump that can rebuild a database without libSQL/SQLite internal tables, and loading
        that dump into a new database. This CLI capability is not a built-in HTTP dump endpoint.
      requirements:
        platform_account:
          value: required
          evidence:
            - cli-auth
        payment_method:
          value: not_required
          evidence:
            - pricing
      costs:
        - kind: free_allowance
          amount: 5
          unit: GB
          per: account
          scope: Free cloud storage; account quota also limits reads, writes and number of databases.
          evidence:
            - pricing
    - id: platform-api
      docs: https://docs.turso.tech/api-reference/quickstart
      interface: api
      maintainer: official
      entry_url: https://api.turso.tech/v1/
      evidence:
        - api
      availability:
        value: self_serve
        evidence:
          - api
      auth:
        value: api_key
        evidence:
          - api
      capabilities:
        database.provision:
          value: documented
          evidence:
            - api
      notes: >-
        Account/organization management uses a Bearer Platform API token, which can be organization-scoped.
        This provisions databases; SQL uses a separate database token and endpoint. The quickstart
        obtains the platform token through an authenticated CLI account. Existing account access and
        new database provisioning are distinct steps.
    - id: sql-http-api
      interface: api
      maintainer: official
      entry_url: https://docs.turso.tech/sdk/http/quickstart
      docs: https://docs.turso.tech/sdk/http/quickstart
      evidence:
        - sql-http
      availability:
        value: self_serve
        evidence:
          - sql-http
      personal_access:
        value: documented
        evidence:
          - pricing
      auth:
        value: api_key
        evidence:
          - sql-http
      capabilities:
        database.persist:
          value: documented
          evidence:
            - sql-http
      notes: >-
        SQL requests use the provisioned database's HTTPS URL with /v2/pipeline and a database Bearer
        token. The endpoint is specific to each database, so the setup guide is retained as the entry
        clue. It supports both cloud engines. Provisioning and account authorization are separate.
        A list of pipeline requests is not itself an atomic transaction. The HTTP guide documents
        connection reuse for explicit transactions and states a 5-second transaction window and
        10-second idle-connection timeout.
    - id: cloud-sdk
      interface: sdk
      maintainer: official
      entry_url: https://docs.turso.tech/sdk/ts/quickstart
      docs: https://docs.turso.tech/sdk/ts/quickstart
      evidence:
        - ts-sdk
        - sdk
      availability:
        value: self_serve
        evidence:
          - ts-sdk
      personal_access:
        value: documented
        evidence:
          - pricing
      auth:
        value: api_key
        evidence:
          - sdk-auth
      capabilities:
        database.persist:
          value: documented
          evidence:
            - ts-sdk
            - sql-http
      notes: >-
        For network-only TypeScript access use @tursodatabase/serverless with the Turso engine or
        @libsql/client with libSQL. A database URL and database auth token are required. Embedded/local
        SDK modes and cached replicas do not by themselves prove a fresh remote read.
        For libSQL, the official reference documents atomic client.batch transactions: all statements
        commit on success and any failure rolls back the batch. Interactive transactions require
        appropriate commit/rollback handling and have a 5-second timeout. SQLite's default ABORT
        conflict handling only reverses the failing statement, not prior statements in the transaction.
  notes:
    - >-
      Logical backup and snapshot export are different paths. The shell and database-create references
      document SQL dump export/import. The db export reference instead warns that its SQLite snapshot
      may omit recent changes until synchronized with an SDK. A successful export alone therefore
      does not establish a complete current backup; retain and verify the actual schema and records.
      Restore/branch features do not by themselves supply an independently usable logical backup.
    - >-
      A restore needs capacity for both source and target, including any retained test databases.
      Reads are scanned rows rather than just returned rows, and writes may consume quota even when
      a transaction is aborted. Account usage, engine, overage setting and actual charges must be
      checked separately; a small output or a successful request does not prove zero service cost.
    - >-
      Reviewed terms contain no specific public-benchmark disclosure ban. They limit use to the
      customer's "own internal business, personal, non-commercial use", exclude use on behalf of or
      for the benefit of third parties, protect content and credentials, and prohibit disruptive use.
      This is not permission to redistribute
      another user's data or offer an unrestricted third-party database service. Small functional
      tests with the customer's own synthetic records do not establish concurrency, latency or
      production durability guarantees.
