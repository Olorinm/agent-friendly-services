id: planetscale
name: PlanetScale
category: databases
homepage: https://planetscale.com/
summary: >-
  PostgreSQL single-node plans start at USD 5/month. No free writable database
  allowance verified; not provisioned in this no-payment round. Public pricing
  SQL is read-only and does not meet the task.
submitted_by: community

catalog:
  version: 1
  classifications:
    - databases/hosted-relational
  sources:
    docs:
      url: https://planetscale.com/docs/cli
      checked_on: '2026-09-07'
      kind: official_docs
    pricing:
      url: https://planetscale.com/pricing
      checked_on: '2026-09-07'
      kind: official_site
  routes:
    - id: database-cli
      interface: cli
      maintainer: official
      entry_url: https://planetscale.com/docs/cli
      evidence:
        - docs
        - pricing
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - docs
      auth:
        value: platform_credentials
        evidence:
          - docs
      capabilities:
        database.provision:
          value: documented
          evidence:
            - docs
      notes: >-
        PostgreSQL single-node plans start at USD 5/month. No free writable database allowance verified; not
        provisioned in this no-payment round. Public pricing SQL is read-only and does not meet the task.
      costs:
        - kind: minimum_spend
          amount: 5
          unit: money
          currency: USD
          per: month
          scope: Postgres single-node starting plan; configuration, region and other resources may cost more.
          evidence:
            - pricing
