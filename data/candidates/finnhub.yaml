id: finnhub
name: Finnhub
category: web-search-data
homepage: https://finnhub.io/
summary: Stock quotes, historical candles and fundamentals; stock candles are documented as premium.
submitted_by: community
tags:
  - stocks
  - financials
catalog:
  version: 1
  classifications:
    - web-search-data/financial-data
  sources:
    docs:
      url: https://finnhub.io/docs/api/quote
      checked_on: '2026-09-09'
      kind: official_docs
  routes:
    - id: data-api
      interface: api
      maintainer: official
      entry_url: https://finnhub.io/docs/api/quote
      docs: https://finnhub.io/docs/api/quote
      evidence:
        - docs
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: unknown
      auth:
        value: api_key
        evidence:
          - docs
      notes: >-
        Dashboard API key required. Stock candles require premium access; a working free quote endpoint
        would not establish free historical-data access.
