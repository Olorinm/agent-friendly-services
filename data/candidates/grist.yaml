  routes:
    - id: rest-api
      docs: https://support.getgrist.com/api/
      interface: api
      maintainer: official
      entry_url: https://docs.getgrist.com/api
      evidence:
        - api
        - auth
        - limits
      availability:
        value: self_serve
        evidence:
          - api
      personal_access:
        value: documented
        evidence:
          - pricing
      auth:
        value: api_key
        evidence:
          - api
      capabilities:
        records.organize:
          value: documented
          evidence:
            - api
        records.track:
          value: documented
          evidence:
            - api
        records.calculate:
          value: documented
          evidence: [api, formulas]
          notes: REST supports formula columns and record reads and updates; Grist maintains formula results as document data changes.
      notes: >-
        Hosted documents remain editable online; the API can create documents, tables and records rather
        than only store opaque data. The account key inherits the user's access. Personal documents use
        docs.getgrist.com; team sites use their own host. Free REST and MCP calls share 3000 calls/month/site
        across documents; remaining account quota is not established by the published allowance. Free
        plans may be rate-limited to 5 requests/second/document; the concurrent request limit is 10 per
        document and request bodies are limited to 1 MB. New blank workspaces depend on the account's
        plan: the older Free personal plan has no workspaces. Current signup gates still require
        observation; documented access is not a registration or task result.
      requirements:
        platform_account:
          value: required
          evidence:
            - signup
      human_steps:
        - stage: signup
          step: Create a Grist account at docs.getgrist.com and use its free personal site; email or Google sign-in is documented.
          evidence:
            - signup
            - mcp
        - stage: credentials
          step: Sign in and generate an API key in account settings.
          evidence:
            - auth
      costs:
        - kind: free_allowance
          amount: 5000
          unit: records
          per: document
          scope: Hosted Free plan; total rows across all tables in one document.
          evidence:
            - pricing
        - kind: free_allowance
          amount: 3000
          unit: API calls
          per: site/month
          scope: Shared REST and MCP pool across documents on the Free personal or team site.
          evidence:
            - limits
            - pricing
    - id: hosted-mcp
      docs: https://support.getgrist.com/mcp/
      interface: mcp
      maintainer: official
      entry_url: https://docs.getgrist.com/api/mcp
      evidence:
        - mcp
        - limits
      availability:
        value: self_serve
        evidence:
          - mcp
      personal_access:
        value: documented
        evidence:
          - mcp
      auth:
        value: api_key
        evidence:
          - mcp
      capabilities:
        records.organize:
          value: documented
          evidence:
            - mcp
        records.track:
          value: documented
          evidence:
            - mcp
        records.calculate:
          value: documented
          evidence: [mcp, formulas]
          notes: Hosted MCP can change column formulas and read and update records; calculations use the same Grist document engine as REST.
      notes: >-
        Hosted MCP is enabled on all plans and accepts API keys or interactive OAuth. The single hosted
        MCP URL serves both personal and team sites, subject to the authenticated user's permissions.
        Documented tools include document and table creation, column formulas and record updates; actual
        tool names use the grist_ prefix. An existing business schema is not a documented prerequisite.
        Calls share the Free site's 3000-call monthly API pool; no separate allowance is implied. The MCP
        FAQ currently states no extra MCP charge; external AI-provider fees remain separate. A client
        tool-call count does not by itself establish backend quota consumption. Documents can
        subsequently be opened and edited in Grist.
      requirements:
        platform_account:
          value: required
          evidence:
            - mcp
    - id: python-sdk
      docs: https://support.getgrist.com/rest-api/
      interface: sdk
      maintainer: official
      entry_url: https://pypi.org/project/grist-api/
      evidence:
        - auth
      auth:
        value: api_key
        evidence:
          - auth
      notes: >-
        Official Python client linked by Grist REST API guide; SDK installation does not remove
        account permission requirements.
    - id: javascript-sdk
      docs: https://support.getgrist.com/rest-api/
      interface: sdk
      maintainer: official
      entry_url: https://www.npmjs.com/package/grist-api
      evidence:
        - auth
      auth:
        value: api_key
        evidence:
          - auth
      notes: >-
        Official JavaScript/TypeScript client linked by Grist REST API guide; npm page fetch
        returned 403 during public research, not a service failure.
  notes:
    - Current Hosted Free includes unlimited documents, 5000 rows and a 10 MB data limit per document, 1 GB internal attachments/document, 30-day history and two guests/document. The older Free personal plan differs, including a 10-document limit and no workspaces. Confirm the actual plan and remaining shared API allowance before applying current pricing to an existing account; these are hosted limits, not unlimited self-hosted capacity.
    - No benchmark-specific or performance-analysis disclosure prohibition was found in the reviewed EULA. Sections 3.2–3.5 restrict disruption, reverse engineering and software redistribution; section 4.4 makes users responsible for their own content. This is not a blanket publication license.
    - The trademark policy permits truthful descriptive discussion without implying affiliation or endorsement. It asks technical articles to link the official website and acknowledge trademark ownership. Grist is a trademark of Grist Labs Inc.; see https://www.getgrist.com/ and the trademark source for the applicable scope.
