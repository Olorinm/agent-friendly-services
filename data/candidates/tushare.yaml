id: tushare
name: Tushare Pro
category: web-search-data
homepage: https://tushare.pro/
summary: Chinese-market prices and financial statements through a token-based HTTP API and Python SDK.
submitted_by: community
tags:
  - china-stocks
  - financials
catalog:
  version: 1
  classifications:
    - web-search-data/financial-data
  sources:
    docs:
      url: https://tushare.pro/document/1?doc_id=40
      checked_on: '2026-09-09'
      kind: official_docs
    access:
      url: https://tushare.pro/document/1?doc_id=290
      checked_on: '2026-09-09'
      kind: official_docs
    points:
      url: https://tushare.pro/document/1?doc_id=108
      checked_on: '2026-09-09'
      kind: official_docs
  routes:
    - id: data-api
      interface: api
      maintainer: official
      entry_url: https://tushare.pro/document/1?doc_id=40
      docs: https://tushare.pro/document/1?doc_id=40
      evidence:
        - docs
        - access
        - points
      availability:
        value: self_serve
        evidence:
          - docs
          - access
      personal_access:
        value: documented
        evidence:
          - docs
          - access
      auth:
        value: api_key
        evidence:
          - docs
          - access
      notes: >-
        Daily unadjusted prices start at 120 points; financial statements start at 2,000. Points are an
        access threshold, not per-call spending. Some datasets need separate permissions. The HTTP
        example uses an unencrypted endpoint; verify a secure credential path before testing.
    - id: python-sdk
      interface: sdk
      maintainer: official
      entry_url: https://tushare.pro/document/1?doc_id=40
      docs: https://tushare.pro/document/1?doc_id=40
      evidence:
        - docs
        - access
        - points
      availability:
        value: self_serve
        evidence:
          - docs
      personal_access:
        value: documented
        evidence:
          - docs
      auth:
        value: api_key
        evidence:
          - docs
      notes: >-
        Python SDK shares token and point thresholds with HTTP access; verify transport security before
        supplying credentials.
