id: paypal
name: PayPal
homepage: https://www.paypal.com/
summary: >-
  Online payment acceptance through Orders API and buyer approval checkout; separate sandbox buyer and
  business seller accounts.
category: payments-billing
submitted_by: community
catalog:
  version: 1
  classifications:
    - payments-billing/accept-payments
  sources:
