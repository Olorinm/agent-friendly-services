id: fred
name: FRED / ALFRED
category: web-search-data
homepage: https://fred.stlouisfed.org/
summary: Economic time series and historical vintages from the Federal Reserve Bank of St. Louis.
submitted_by: community
tags:
  - macro
  - fx
catalog:
  version: 1
  classifications:
    - web-search-data/financial-data
  sources:
    docs:
      url: https://fred.stlouisfed.org/docs/api/fred/
      checked_on: '2026-09-09'
      kind: official_docs
    access:
      url: https://fred.stlouisfed.org/docs/api/api_key.html
      checked_on: '2026-09-09'
      kind: official_docs
  routes:
    - id: data-api
      interface: api
      maintainer: official
      entry_url: https://fred.stlouisfed.org/docs/api/fred/
      docs: https://fred.stlouisfed.org/docs/api/fred/
      evidence:
        - docs
        - access
      availability:
        value: self_serve
        evidence:
          - docs
          - access
      personal_access:
        value: documented
        evidence:
          - docs
          - access
      auth:
        value: api_key
        evidence:
          - docs
          - access
      notes: >-
        A registered account can request an API key. Series units, seasonal adjustment, source and
        vintage matter; not a stock-price provider.
